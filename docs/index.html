<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>English Trainer — C2 business English</title>
<meta name="description" content="Drill C2-level business English phrases with spaced repetition. Negotiation, meetings, networking, financial and legal English, with Czech translations and register notes.">
<link rel="canonical" href="https://michalholba.github.io/english-trainer/">

<!-- iOS home-screen install -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="English">
<meta name="theme-color" content="#3B6FF5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1017" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233B6FF5'/%3E%3Cstop offset='1' stop-color='%237B4DFF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='url(%23g)'/%3E%3Ctext x='90' y='126' font-family='-apple-system,Helvetica,Arial' font-size='100' font-weight='700' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   English Phrase Trainer — C2 business English drill
   Single file, zero dependencies. Content lives in content.js.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  color-scheme: light dark;

  --brand:       #3B6FF5;
  --brand-2:     #7B4DFF;
  --brand-deep:  #2450C8;
  --grad:        linear-gradient(135deg, #3B6FF5 0%, #7B4DFF 100%);

  --bg:          #F4F6FB;
  --bg-2:        #EAEEF8;
  --card:        #FFFFFF;
  --text:        #131A2B;
  --text-soft:   #5A6782;
  --text-faint:  #8B97AF;
  --line:        #E2E8F2;

  --green:       #0E9F76;
  --amber:       #E08600;
  --red:         #E0455A;
  --violet:      #7B4DFF;

  --sh-sm: 0 1px 2px rgba(19,26,43,.06), 0 1px 3px rgba(19,26,43,.04);
  --sh-md: 0 2px 4px rgba(19,26,43,.05), 0 6px 16px rgba(19,26,43,.07);
  --sh-lg: 0 8px 28px rgba(19,26,43,.10), 0 2px 6px rgba(19,26,43,.05);
  --sh-brand: 0 6px 18px rgba(59,111,245,.32);

  --r:    18px;
  --r-sm: 12px;
  --pad:  16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:         #0D1017;
    --bg-2:       #141926;
    --card:       #181E2A;
    --text:       #ECF1FA;
    --text-soft:  #A2AFC6;
    --text-faint: #6E7C95;
    --line:       #262E3E;
    --brand:      #6E9BFF;
    --brand-2:    #A98BFF;
    --brand-deep: #3B6FF5;
    --green:      #2BC79A;
    --amber:      #FFA92E;
    --red:        #FF6B7E;
    --violet:     #A98BFF;
    --sh-sm: 0 1px 2px rgba(0,0,0,.4);
    --sh-md: 0 4px 14px rgba(0,0,0,.45);
    --sh-lg: 0 10px 32px rgba(0,0,0,.55);
    --sh-brand: 0 6px 20px rgba(59,111,245,.42);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

/* soft ambient wash behind everything */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(90vw 55vh at 8% -8%,  rgba(59,111,245,.13), transparent 62%),
    radial-gradient(85vw 50vh at 100% 0%, rgba(123,77,255,.11), transparent 60%),
    linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 42%);
}

body {
  min-height: 100vh; min-height: 100dvh;
  padding: calc(var(--safe-t) + 6px) 0 calc(var(--safe-b) + 10px);
  display: flex; flex-direction: column;
}

.wrap {
  width: 100%; max-width: 640px;
  margin: 0 auto; padding: 0 var(--pad);
  flex: 1; display: flex; flex-direction: column;
}

/* ── header ───────────────────────────────────────────────────────── */
header { display: flex; align-items: center; gap: 10px; padding: 10px 2px 16px; }

.mark {
  width: 30px; height: 30px; border-radius: 9px; flex: none;
  background: var(--grad); box-shadow: var(--sh-brand);
  display: grid; place-items: center;
  color: #fff; font-weight: 800; font-size: 16px; letter-spacing: -.02em;
}
header h1 {
  font-size: 18px; font-weight: 700; margin: 0;
  letter-spacing: -.025em; flex: 1;
}

.pill {
  font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  padding: 5px 11px; border-radius: 999px;
  background: color-mix(in srgb, var(--brand) 13%, transparent);
  color: var(--brand-deep); white-space: nowrap;
}
@media (prefers-color-scheme: dark) { .pill { color: var(--brand); } }

.iconbtn {
  border: 1px solid var(--line); background: var(--card);
  color: var(--text-soft); border-radius: 10px;
  min-width: 44px; height: 36px; font-size: 14px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0 12px; box-shadow: var(--sh-sm);
  transition: transform .12s, background .15s;
}
.iconbtn:active { transform: scale(.96); background: var(--bg-2); }

/* ── card ─────────────────────────────────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 20px;
  box-shadow: var(--sh-md);
}

/* ── hero ─────────────────────────────────────────────────────────── */
.hero {
  position: relative; overflow: hidden;
  border-radius: var(--r); padding: 20px;
  background: var(--grad); color: #fff;
  box-shadow: var(--sh-brand);
  margin-bottom: 22px;
}
.hero::after {
  content: ""; position: absolute; right: -34px; top: -54px;
  width: 190px; height: 190px; border-radius: 50%;
  background: rgba(255,255,255,.13);
}
.hero::before {
  content: ""; position: absolute; right: 42px; bottom: -66px;
  width: 120px; height: 120px; border-radius: 50%;
  background: rgba(255,255,255,.09);
}
.hero .kicker {
  font-size: 11.5px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; opacity: .82; margin-bottom: 7px;
}
.hero .figs { display: flex; align-items: baseline; gap: 8px; position: relative; z-index: 1; }
.hero .fig { font-size: 38px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.hero .unit { font-size: 15px; font-weight: 600; opacity: .9; }
.hero .sub { font-size: 13.5px; opacity: .88; margin-top: 9px; position: relative; z-index: 1; }

.hbar {
  position: relative; z-index: 1;
  margin-top: 14px; height: 6px; border-radius: 99px;
  background: rgba(255,255,255,.26); overflow: hidden;
}
.hbar > i {
  display: block; height: 100%; border-radius: 99px;
  background: #fff; width: 0; transition: width .6s cubic-bezier(.4,0,.2,1);
}

/* ── activity ─────────────────────────────────────────────────────── */
.activity { padding: 16px 18px 14px; }
.acts-row { display: flex; align-items: stretch; gap: 8px; }
.act { flex: 1; text-align: center; }
.act-div { width: 1px; background: var(--line); flex: none; }
.act-v {
  font-size: 27px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1;
  font-variant-numeric: tabular-nums;
  background: var(--grad); -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.act-v.zero { background: none; -webkit-text-fill-color: var(--text-faint); color: var(--text-faint); }
.act-k {
  font-size: 10.5px; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--text-faint); margin-top: 3px;
}
.act-s { font-size: 11.5px; color: var(--text-soft); margin-top: 4px; min-height: 14px; }

.spark {
  display: flex; align-items: flex-end; gap: 3px;
  height: 34px; margin-top: 14px;
}
.spark i {
  flex: 1; border-radius: 3px 3px 1px 1px; min-height: 3px;
  background: color-mix(in srgb, var(--brand) 22%, transparent);
  transition: height .4s cubic-bezier(.4,0,.2,1);
}
.spark i.on   { background: var(--grad); }
.spark i.today { background: var(--grad); box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand) 26%, transparent); }
.spark-cap {
  font-size: 10.5px; color: var(--text-faint); text-align: center;
  margin-top: 7px; letter-spacing: .03em;
}

.nostore {
  margin-top: 12px; padding: 10px 12px; border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--amber) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--amber) 30%, transparent);
  font-size: 12.5px; line-height: 1.45; color: var(--text);
}

/* ── section labels ───────────────────────────────────────────────── */
.seclabel {
  font-size: 11.5px; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--text-faint);
  margin: 22px 0 10px; padding-left: 2px;
}

/* ── mode selector ────────────────────────────────────────────────── */
.modes { display: grid; gap: 11px; }
.mode {
  position: relative; display: flex; align-items: flex-start; gap: 14px;
  padding: 17px; border-radius: var(--r);
  border: 1.5px solid var(--line); background: var(--card);
  cursor: pointer; text-align: left; width: 100%;
  font: inherit; color: inherit; box-shadow: var(--sh-sm);
  transition: border-color .18s, box-shadow .18s, transform .12s, background .18s;
}
.mode:active { transform: scale(.985); }
.mode[aria-pressed="true"] {
  border-color: transparent;
  box-shadow: var(--sh-md), 0 0 0 2px var(--brand) inset;
  background: color-mix(in srgb, var(--brand) 6%, var(--card));
}
.mode .ico {
  width: 42px; height: 42px; flex: none; border-radius: 12px;
  display: grid; place-items: center; font-size: 20px;
  background: color-mix(in srgb, var(--brand) 12%, transparent);
  transition: background .18s;
}
.mode[aria-pressed="true"] .ico { background: var(--grad); box-shadow: var(--sh-brand); }
.mode b { display: block; font-size: 16px; font-weight: 700; margin-bottom: 3px; letter-spacing: -.015em; }
.mode span.d { font-size: 13.5px; color: var(--text-soft); line-height: 1.45; display: block; }

/* ── chips ────────────────────────────────────────────────────────── */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 13.5px; font-weight: 600;
  padding: 9px 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--card);
  color: var(--text-soft); cursor: pointer; box-shadow: var(--sh-sm);
  transition: transform .12s, background .18s, color .18s, border-color .18s;
}
.chip:active { transform: scale(.94); }
.chip[aria-pressed="true"] {
  border-color: transparent; background: var(--grad); color: #fff;
  box-shadow: var(--sh-brand);
}
.chip .n {
  opacity: .62; font-size: 11.5px; margin-left: 5px;
  font-variant-numeric: tabular-nums; font-weight: 700;
}
.chip[aria-pressed="true"] .n { opacity: .85; }

/* ── primary CTA ──────────────────────────────────────────────────── */
.start {
  margin-top: 26px; width: 100%;
  font: inherit; font-size: 17px; font-weight: 700; letter-spacing: -.01em;
  padding: 17px; border-radius: 15px; border: 0;
  background: var(--grad); color: #fff; cursor: pointer;
  box-shadow: var(--sh-brand);
  transition: transform .12s, box-shadow .18s, filter .18s;
}
.start:active { transform: scale(.985); filter: brightness(.95); }
.start:disabled { opacity: .45; box-shadow: none; }

/* ── drill screen ─────────────────────────────────────────────────── */
.bar {
  height: 5px; background: var(--line); border-radius: 99px;
  overflow: hidden; margin-bottom: 16px;
}
.bar > i {
  display: block; height: 100%; border-radius: 99px;
  background: var(--grad); width: 0;
  transition: width .45s cubic-bezier(.4,0,.2,1);
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(10px) scale(.995); }
  to   { opacity: 1; transform: none; }
}
.anim { animation: cardIn .3s cubic-bezier(.2,.7,.3,1) both; }

@keyframes revealIn {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: none; }
}

.meta {
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  font-size: 11.5px; color: var(--text-faint); margin-bottom: 14px;
}
.tag {
  font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
  background: var(--bg-2); border: 1px solid transparent; color: var(--text-soft);
  letter-spacing: .01em;
}
.tag.reg-casual      { color: var(--violet); background: color-mix(in srgb, var(--violet) 13%, transparent); }
.tag.reg-neutral     { color: var(--text-soft); }
.tag.reg-client-safe { color: var(--green);  background: color-mix(in srgb, var(--green) 14%, transparent); }
.tag.reg-idiom       { color: var(--amber);  background: color-mix(in srgb, var(--amber) 15%, transparent); }
.tag.reg-formal      { color: var(--brand-deep); background: color-mix(in srgb, var(--brand) 13%, transparent); }
.tag.reg-slang       { color: var(--red);    background: color-mix(in srgb, var(--red) 13%, transparent); }
@media (prefers-color-scheme: dark) { .tag.reg-formal { color: var(--brand); } }

.en {
  font-size: 26px; line-height: 1.3; font-weight: 750;
  letter-spacing: -.03em; margin: 0 0 11px;
  background: var(--grad); -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.cs { font-size: 17px; color: var(--text-soft); margin: 0 0 2px; line-height: 1.45; }

.block { margin-top: 17px; padding-top: 16px; border-top: 1px solid var(--line); }
.block .h {
  font-size: 11px; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--text-faint); margin-bottom: 6px;
}
.block .b { font-size: 15.5px; line-height: 1.55; }
.ex {
  font-style: italic; color: var(--text-soft);
  padding-left: 13px; border-left: 3px solid color-mix(in srgb, var(--brand) 32%, transparent);
}
.tip { color: var(--text); }

.warn {
  margin-top: 16px; padding: 13px 15px; border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--amber) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--amber) 28%, transparent);
  font-size: 14.5px; line-height: 1.5;
}
.warn .h {
  font-size: 11px; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--amber); margin-bottom: 5px;
}
.warn s { color: var(--text-faint); text-decoration-thickness: 1.5px; }
.warn b { font-weight: 700; }

/* testing */
.situation { font-size: 21px; line-height: 1.4; font-weight: 650; letter-spacing: -.02em; margin: 8px 0 4px; }
.ask {
  font-size: 13.5px; color: var(--text-faint); margin-top: 14px;
  display: flex; align-items: center; gap: 7px;
}
.ask::before { content: "🗣"; font-size: 15px; }

.answer {
  margin-top: 20px; padding-top: 18px;
  border-top: 2px dashed var(--line);
  animation: revealIn .28s cubic-bezier(.2,.7,.3,1) both;
}

.variants { margin: 11px 0 0; padding-left: 17px; }
.variants li { font-size: 15px; color: var(--text-soft); margin-bottom: 5px; line-height: 1.45; }
.variants li::marker { color: var(--brand); }

/* actions */
.actions { display: grid; gap: 10px; margin-top: 18px; }
.grades  { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; }
.btn {
  font: inherit; font-size: 16px; font-weight: 700; letter-spacing: -.01em;
  padding: 15px 12px; border-radius: 14px;
  border: 1.5px solid var(--line); background: var(--card);
  color: var(--text); cursor: pointer; text-align: center;
  box-shadow: var(--sh-sm);
  transition: transform .12s, filter .18s, background .18s;
}
.btn:active { transform: scale(.97); }
.btn.primary {
  background: var(--grad); border-color: transparent; color: #fff;
  box-shadow: var(--sh-brand);
}
.btn.g-got    { border-color: color-mix(in srgb, var(--green) 45%, transparent); color: var(--green);
                background: color-mix(in srgb, var(--green) 7%, var(--card)); }
.btn.g-nearly { border-color: color-mix(in srgb, var(--amber) 45%, transparent); color: var(--amber);
                background: color-mix(in srgb, var(--amber) 7%, var(--card)); }
.btn.g-miss   { border-color: color-mix(in srgb, var(--red) 45%, transparent); color: var(--red);
                background: color-mix(in srgb, var(--red) 7%, var(--card)); }
.grades .btn { font-size: 14.5px; padding: 13px 4px; }
.grades .btn small {
  display: block; font-size: 10.5px; font-weight: 600;
  opacity: .72; margin-top: 3px; letter-spacing: .02em;
}

/* ── done ─────────────────────────────────────────────────────────── */
.done { text-align: center; padding: 36px 20px; }
.done .big { font-size: 52px; margin-bottom: 8px; line-height: 1; }
.done h2 { margin: 0 0 7px; font-size: 22px; font-weight: 750; letter-spacing: -.02em; }
.done p  { color: var(--text-soft); margin: 0 0 22px; font-size: 15px; }

.ring { margin: 0 auto 18px; width: 116px; height: 116px; position: relative; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring .track { stroke: var(--line); }
.ring .fill  { stroke: url(#ringGrad); stroke-linecap: round;
               transition: stroke-dashoffset .9s cubic-bezier(.4,0,.2,1); }
.ring .pct {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 28px; font-weight: 800; letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
}

.stats { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; }
.stat {
  flex: 1; max-width: 96px; padding: 13px 8px;
  border-radius: var(--r-sm); background: var(--bg-2);
}
.stat .v { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat .k {
  font-size: 10.5px; color: var(--text-faint); text-transform: uppercase;
  letter-spacing: .07em; font-weight: 700; margin-top: 2px;
}

.hidden { display: none !important; }

footer { text-align: center; font-size: 12px; color: var(--text-faint); padding: 20px 0 6px; }
footer a { color: var(--brand); text-decoration: none; font-weight: 600; }
footer a:active { opacity: .6; }

@media (max-width: 380px) {
  .en { font-size: 23px; }
  .situation { font-size: 19px; }
  .hero .fig { font-size: 33px; }
  .grades .btn { font-size: 13.5px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="mark">E</span>
    <h1 id="title">English Trainer</h1>
    <span class="pill" id="pill"></span>
    <button class="iconbtn hidden" id="quit" title="End session">Done</button>
  </header>

  <!-- ══ HOME ══ -->
  <main id="home">
    <section class="hero">
      <div class="kicker">Ready to practice</div>
      <div class="figs">
        <span class="fig" id="h-due">0</span>
        <span class="unit" id="h-unit">phrases due</span>
      </div>
      <div class="sub" id="h-sub"></div>
      <div class="hbar"><i id="h-bar"></i></div>
    </section>

    <div class="seclabel">Activity</div>
    <section class="card activity">
      <div class="acts-row">
        <div class="act">
          <div class="act-v" id="a-week">0</div>
          <div class="act-k">Last 7 days</div>
          <div class="act-s" id="a-week-sub">&nbsp;</div>
        </div>
        <div class="act-div"></div>
        <div class="act">
          <div class="act-v" id="a-month">0</div>
          <div class="act-k">Last 30 days</div>
          <div class="act-s" id="a-month-sub">&nbsp;</div>
        </div>
      </div>
      <div class="spark" id="spark" aria-hidden="true"></div>
      <div class="spark-cap" id="spark-cap"></div>
    </section>

    <div class="seclabel">Mode</div>
    <div class="modes">
      <button class="mode" id="m-learn" aria-pressed="true">
        <span class="ico">📖</span>
        <span>
          <b>Learning</b>
          <span class="d">Phrases in random order with Czech, register, an example and a usage tip.</span>
        </span>
      </button>
      <button class="mode" id="m-test" aria-pressed="false">
        <span class="ico">🎯</span>
        <span>
          <b>Testing</b>
          <span class="d">A situation in Czech — say it in English, then reveal and grade yourself.</span>
        </span>
      </button>
    </div>

    <div class="seclabel">Theme</div>
    <div class="chips" id="themes"></div>

    <div class="seclabel">Order</div>
    <div class="chips" id="orders"></div>

    <button class="start" id="start">Start</button>
    <footer id="foot"></footer>
  </main>

  <!-- ══ DRILL ══ -->
  <main id="drill" class="hidden">
    <div class="bar"><i id="prog"></i></div>
    <div class="card" id="cardbox"></div>
    <div class="actions" id="acts"></div>

    en: "What would have to be true for this to work?",
    cs: "Co by muselo platit, aby to fungovalo?",
    tip: "A famous strategy-consulting question. It converts a vague debate into a testable list of assumptions.",
    situation: "Návrh je optimistický. Obraťte diskuzi na jeho předpoklady." },

  { id: "adv-cost-inaction", theme: "decision-making", register: "formal", lessons: [8], date: "2026-03-13",
    en: "What's the cost of inaction?",
    cs: "Kolik nás bude stát, když neuděláme nic?",
    tip: "Reframes risk: doing nothing is also a decision with a price. Powerful against excessive caution.",
    situation: "Vedení váhá s rozhodnutím. Otočte perspektivu na cenu nečinnosti." },

  { id: "adv-walk-away", theme: "decision-making", register: "formal", lessons: [8], date: "2026-03-13",
    en: "What's our walk-away point?",
    cs: "Kde je náš bod, kdy od jednání odejdeme?",
    tip: "Core negotiation concept (your BATNA threshold). Knowing it before you enter the room is what gives you leverage.",
    situation: "Před jednáním si potřebujete ujasnit hranici, za kterou nejdete." },

  { id: "adv-optimizing-for", theme: "decision-making", register: "formal", lessons: [8], date: "2026-03-13",
    en: "What are we optimizing for?",
    cs: "Co je vlastně naše priorita?",
    tip: "Surfaces conflicting goals (speed vs. cost vs. quality) that are usually the real reason a team is stuck.",
    situation: "Tým se nemůže shodnout. Zeptejte se, co je vlastně cílem." },

  { id: "adv-sanity-check", theme: "decision-making", register: "neutral", lessons: [8], date: "2026-03-13",
    en: "Let's sanity-check the numbers.",
    cs: "Pojďme si ta čísla ověřit selským rozumem.",
    tip: "A quick plausibility check, not a full audit. Casual enough for any meeting, and it doesn't accuse anyone of error.",
    situation: "Čísla vypadají podezřele. Navrhněte rychlou kontrolu.",
    variants: ["Let's double-check this against other reports.", "Let's triangulate the data."] },

  { id: "adv-inflection-point", theme: "strategy-growth", register: "formal", lessons: [8], date: "2026-03-13",
    en: "We're approaching an inflection point.",
    cs: "Blížíme se k bodu zlomu.",
    tip: "The moment a trend changes direction or accelerates. Common in earnings calls and strategy decks.",
    situation: "Firma se blíží k zásadní změně trajektorie. Popište to." },

  { id: "adv-double-down", theme: "strategy-growth", register: "idiom", lessons: [8], date: "2026-03-13",
    en: "We need to double down on this.",
    cs: "Musíme na to vsadit ještě víc.",
    tip: "From blackjack: increase commitment to something already working. Note it's about intensifying, not just continuing.",
    situation: "Něco funguje. Navrhněte, ať do toho investujete ještě víc.",
    variants: ["Let's play to our strengths."] },

  { id: "adv-dont-pencil-out", theme: "financial", register: "idiom", lessons: [8], date: "2026-03-13",
    en: "The economics don't quite pencil out.",
    cs: "Ekonomika toho projektu nevychází.",
    tip: "“Pencil out” = work when you actually do the math. Softer and more collegial than “this is unprofitable”.",
    situation: "Projekt se finančně nevyplatí. Řekněte to diplomaticky.",
    variants: ["The numbers don't add up.", "It's not commercially viable.", "The margins are too thin.", "It doesn't make financial sense."] },

  { id: "adv-intellectually-honest", theme: "leadership", register: "formal", lessons: [8], date: "2026-03-13",
    en: "Let's be intellectually honest about this.",
    cs: "Buďme k sobě upřímní.",
    tip: "Invites the room to drop convenient narratives. Strong but not aggressive — it appeals to shared standards.",
    situation: "Tým si nalhává, že projekt jde dobře. Vyzvěte k upřímnosti.",
    variants: ["Let's not kid ourselves."] },

  { id: "adv-hold-the-line", theme: "leadership", register: "idiom", lessons: [8], date: "2026-03-13",
    en: "We need to hold the line on this.",
    cs: "Musíme si na tom stát.",
    tip: "Military origin: don't retreat under pressure. Used for prices, standards, or principles.",
    situation: "Tlačí na vás, ať slevíte. Trvejte na svém." },

  { id: "adv-clear-ownership", theme: "leadership", register: "neutral", lessons: [8], date: "2026-03-13",
    en: "We need clear ownership.",
    cs: "Potřebujeme jasnou zodpovědnost.",
    tip: "“Ownership” = one named person accountable, not shared responsibility. The standard fix for a stalled project.",
    situation: "Úkol nemá jasného vlastníka a nikam se nehne. Pojmenujte problém.",
    variants: ["This deserves senior-level attention.", "We need to operate with more urgency."] },

  { id: "adv-over-engineering", theme: "leadership", register: "neutral", lessons: [8], date: "2026-03-13",
    en: "We're over-engineering the solution.",
    cs: "Děláme to zbytečně složitě.",
    tip: "Criticizes the approach, not the people. Pairs well with “Let's avoid false precision.”",
    situation: "Řešení je zbytečně komplikované. Řekněte to." },

  { id: "adv-crux", theme: "negotiating", register: "formal", lessons: [8], date: "2026-03-13",
    en: "Let's get to the crux of the matter.",
    cs: "Pojďme k jádru věci.",
    tip: "“Crux” = the decisive point everything else depends on. More precise and more senior than “the main thing”.",
    situation: "Diskuze se točí kolem podružností. Přejděte k jádru." },

  { id: "adv-non-starter", theme: "negotiating", register: "idiom", lessons: [8], date: "2026-03-13",
    en: "That's a non-starter for us.",
    cs: "To pro nás nepřichází v úvahu.",
    tip: "A firm, final no — the proposal can't even begin. Use deliberately: it closes that avenue completely.",
    situation: "Podmínka je zcela nepřijatelná. Odmítněte ji jednoznačně." },

  { id: "adv-common-ground", theme: "negotiating", register: "neutral", lessons: [8, 9], date: "2026-03-20",
    en: "Let's find the common ground.",
    cs: "Pojďme najít společnou řeč.",
    tip: "Standard de-escalation move when positions have hardened.",
    situation: "Jednání se zablokovalo. Navrhněte hledání shody.",
    variants: ["There's common ground here — we just need to tighten it."] },

  { id: "adv-keep-optionality", theme: "negotiating", register: "formal", lessons: [8], date: "2026-03-13",
    en: "Let's keep optionality.",
    cs: "Nechme si otevřená vrátka.",
    tip: "“Optionality” = the value of not committing yet. Finance-flavored and distinctly senior.",
    situation: "Nechcete se zavázat příliš brzy. Navrhněte, ať si necháte možnosti." },

  { id: "adv-move-quickly", theme: "negotiating", register: "client-safe", lessons: [8], date: "2026-03-13",
    en: "We're prepared to move quickly if the conditions are right.",
    cs: "Jsme připraveni jednat rychle, pokud budou podmínky správné.",
    tip: "Signals genuine interest while keeping conditions attached — pressure and flexibility in one sentence.",
    situation: "Chcete ukázat zájem, ale nezavázat se bezpodmínečně." },

  /* ══════════════════════════════════════════════════════════════════
     LESSON 7 — Financial English  (2025-12-12)
     ══════════════════════════════════════════════════════════════════ */

  { id: "fin-surge", theme: "financial", register: "formal", lessons: [7], date: "2025-12-12",
    en: "surge — a sudden, strong increase",
    cs: "prudce vzrůst",
    example: "Energy prices surged following supply disruptions in the region.",
    tip: "Strength ladder up: edge higher < climb < gain < jump < surge < soar. “Surge” implies suddenness and volume.",
    situation: "Ceny energií prudce vzrostly po výpadku dodávek. Popište to jako analytik." },

  { id: "fin-soar", theme: "financial", register: "formal", lessons: [7], date: "2025-12-12",
    en: "soar — to rise dramatically, often impressively",
    cs: "vystřelit prudce nahoru",
    example: "The company's share price soared after it beat earnings expectations.",
    tip: "Stronger and more admiring than “surge”. Reserve it for genuinely striking moves.",
    situation: "Akcie po překonání očekávání dramaticky vzrostly. Popište to." },

  { id: "fin-rally", theme: "financial", register: "formal", lessons: [7], date: "2025-12-12",
    en: "rally — to recover and rise after a fall",
    cs: "zotavit se a růst po poklesu",
    example: "Markets rallied after inflation data came in lower than expected.",
    tip: "Implies a prior decline — a rally is always a recovery, never a rise from nothing.",
    situation: "Trhy se po dobrých datech zotavily z poklesu. Popište to." },

  { id: "fin-edge-higher", theme: "financial", register: "formal", lessons: [7], date: "2025-12-12",
    en: "edge higher / edge lower — to move slightly up or down",
    cs: "mírně růst / mírně klesat",
    example: "Shares edged higher as sentiment in the sector improved.",
    tip: "The most understated verbs in the set — precise for small moves where “rose” would overstate.",
    situation: "Akcie mírně posílily. Popište malý pohyb přesně." },

  { id: "fin-tumble", theme: "financial", register: "formal", lessons: [7], date: "2025-12-12",
    en: "tumble — to fall sharply and suddenly",
    cs: "zřítit se, prudce spadnout",
    example: "Shares tumbled after the company issued a profit warning.",
    tip: "Strength ladder down: edge lower < slip < decline < drop < fall < tumble < plunge < crash.",
    situation: "Akcie prudce spadly po varování o zisku. Popište to." },

  { id: "fin-plunge", theme: "financial", register: "formal", lessons: [7], date: "2025-12-12",
    en: "plunge — to fall suddenly and severely",
    cs: "prudce se propadnout",
    example: "Markets plunged on fears of a systemic banking crisis.",
    tip: "Stronger than “tumble”. Only “crash” outranks it.",
    situation: "Trhy se propadly kvůli obavám z bankovní krize. Popište to." },

  { id: "fin-lose-ground", theme: "financial", register: "formal", lessons: [7], date: "2025-12-12",
    en: "lose ground — to weaken, especially against a benchmark",
    cs: "ztrácet pozici / oslabovat",
    example: "The stock lost ground following rumors of regulatory scrutiny.",
    tip: "Implies relative decline — losing versus a peer, index, or currency.",
    situation: "Akcie oslabila kvůli fámám o regulaci. Popište to." },

  { id: "fin-dislocation", theme: "financial", register: "formal", lessons: [7], date: "2025-12-12",
    en: "dislocation — a breakdown between price and underlying value",
    cs: "rozpojení ceny a skutečné hodnoty (tržní dislokace)",
    example: "The crisis created major dislocations in credit markets.",
    tip: "WSJ-level vocabulary. Signals stress or panic rather than normal price discovery — and often an opportunity.",
    situation: "Krize způsobila, že ceny přestaly odpovídat hodnotě. Pojmenujte to odborně." },

  { id: "fin-contagion", theme: "financial", register: "formal", lessons: [7], date: "2025-12-12",
    en: "contagion — financial problems spreading from one market to others",
    cs: "nákaza, přelévání problémů mezi trhy",
    example: "Fears of contagion pushed global markets lower.",
    tip: "Medical metaphor, entirely standard in finance. Used heavily in banking-crisis coverage.",
    situation: "Problémy jedné banky se šíří na další trhy. Popište to." },

  { id: "fin-impairment", theme: "financial", register: "formal", lessons: [7], date: "2025-12-12",
    en: "impairment — a reduction in the recorded value of an asset",
    cs: "snížení účetní hodnoty aktiva",
    example: "The company took a $2 billion impairment charge.",
    tip: "Accounting term. Note the collocation: you *take* an impairment charge.",
    situation: "Firma musela odepsat hodnotu aktiva. Řekněte to účetní terminologií." },

  { id: "fin-compression", theme: "financial", register: "formal", lessons: [7], date: "2025-12-12",
    en: "compression — shrinking margins or valuations",
    cs: "stlačení marží nebo valuací",
    example: "Margin compression hurt profitability.",
    tip: "Usually seen as “margin compression” or “multiple compression”.",
    situation: "Marže se ztenčily a zasáhly ziskovost. Popište to." },

  { id: "fin-repricing", theme: "financial", register: "formal", lessons: [7], date: "2025-12-12",
    en: "repricing — markets adjusting prices to new information or risk",
    cs: "přecenění trhem",
    example: "The market is repricing growth expectations.",
    tip: "Neutral and mechanical — describes adjustment without implying panic.",
    situation: "Trh přehodnocuje očekávání růstu. Popište to." },

  { id: "fin-suspicion-ladder", theme: "grammar-traps", register: "formal", lessons: [7], date: "2025-12-12",
    en: "off → fishy → questionable → dubious → concerning → suspect → opaque → dodgy → shady → crooked / illicit",
    cs: "žebříček síly podezření od nejmírnějšího po nejsilnější",
    tip: "Register matters more than meaning here. Analyst note: questionable / concerning / opaque / dubious. Small talk: fishy / off. Accusation: shady / dodgy / illicit. “Sus” is internet slang — never at work.",
    situation: "Seřaďte výrazy pro podezření od nejmírnějšího po nejostřejší." },

  { id: "fin-opaque-professional", theme: "financial", register: "formal", lessons: [7], date: "2025-12-12",
    en: "The deal structure appears opaque and raises governance concerns.",
    cs: "Struktura transakce působí neprůhledně a vyvolává otázky ohledně správy.",
    original: "The deal is shady.",
    example: "❌ The deal is shady. → ✅ The deal structure appears opaque and raises governance concerns.",
    tip: "The professional register for suspicion: describe the structure, not the people's morals. “Shady” accuses; “opaque” observes.",
    situation: "Transakce je podezřelá. Vyjádřete to profesionálně, ne emotivně." },

  { id: "fin-numbers-questionable", theme: "financial", register: "formal", lessons: [7], date: "2025-12-12",
    en: "The numbers look questionable and warrant further review.",
    cs: "Ta čísla vypadají sporně a zaslouží si další prověření.",
    original: "Something is fishy with the numbers.",
    tip: "“Warrant further review” is the standard analyst hedge — it flags a concern without making an allegation.",
    situation: "Čísla nesedí. Napište to jako analytik, ne jako v hospodě." },

  /* ══════════════════════════════════════════════════════════════════
     LESSON 11 — Crime & punishment  (2026-03-14)

  { id: "law-infraction", theme: "crime-vocabulary", register: "formal", lessons: [11], date: "2026-03-14",

    cs: "přestupek (pokuta, žádné vězení)",
    example: "Speeding, littering and jaywalking are infractions.",
    tip: "No jury trial, no jail, and usually no criminal record. The bottom of the American severity ladder.",
    situation: "Vysvětlete, co je nejmírnější kategorie porušení zákona v USA." },

  { id: "law-misdemeanor", theme: "crime-vocabulary", register: "formal", lessons: [11], date: "2026-03-14",

    cs: "přečin (až rok ve vězení typu „jail\")",
    example: "Petty theft, public intoxication and vandalism are misdemeanors.",
    tip: "Middle tier. The one-year line is what separates it from a felony.",
    situation: "Vysvětlete střední kategorii trestných činů v USA." },

  { id: "law-felony", theme: "crime-vocabulary", register: "formal", lessons: [11], date: "2026-03-14",

    cs: "zločin (přes rok ve věznici „prison\")",
    example: "Murder, armed robbery and arson are felonies.",
    tip: "Carries lifelong consequences — loss of voting and firearm rights. Often graded by class (Class A is the most severe).",
    situation: "Vysvětlete nejzávažnější kategorii trestných činů a její následky." },

  { id: "law-jail-vs-prison", theme: "crime-vocabulary", register: "formal", lessons: [11], date: "2026-03-14",

    situation: "Vysvětlete rozdíl mezi „jail\" a „prison\"." },

  { id: "law-charge-sentence", theme: "crime-vocabulary", register: "formal", lessons: [11], date: "2026-03-14",

    cs: "obvinění · odsouzení (uznání viny) · trest",

  /* ══════════════════════════════════════════════════════════════════

    tip: "Collocation: you *grant* or *give* power of attorney. No article: “granted power of attorney”, not “a power of attorney”.",
    situation: "Zmocnila právníka, aby za ni jednal. Popište to právní angličtinou." },

  { id: "law-breach-of-contract", theme: "legal", register: "formal", lessons: [4], date: "2025-05-09",

    cs: "porušení smlouvy",
    example: "They sued us for breach of contract when we failed to deliver on time.",
    tip: "Note the preposition: sued *for* breach of contract. Also “in breach of” = currently violating.",
    situation: "Nedodali jste včas a klient vás žaluje. Popište to." },

  { id: "law-nda", theme: "legal", register: "formal", lessons: [4], date: "2025-05-09",

    cs: "dohoda o mlčenlivosti",
    example: "Before discussing the project, we asked them to sign an NDA.",
    tip: "Always “sign an NDA”. In speech the abbreviation is far more common than the full phrase.",
    situation: "Před jednáním chcete podepsat mlčenlivost. Řekněte to." },

  { id: "law-non-compete", theme: "legal", register: "formal", lessons: [4], date: "2025-05-09",
    en: "non-compete clause — a provision restricting work with competitors",
    cs: "konkurenční doložka",

    tip: "Distinct from a non-solicitation agreement, which restricts poaching clients or staff rather than employment itself.",
    situation: "Zaměstnanec nesmí dva roky ke konkurenci. Popište tu doložku." },

    example: "The term sheet was signed before due diligence began.",
    tip: "Standard in M&A and venture capital. Non-binding, but it frames everything that follows.",
    situation: "Před due diligence jste podepsali základní podmínky. Pojmenujte dokument." },

  { id: "law-indemnity", theme: "legal", register: "formal", lessons: [4], date: "2025-05-09",
    en: "indemnity — an obligation to compensate another party's loss",
    cs: "odškodnění, záruka náhrady škody",
    example: "The supplier agreed to indemnify us against any third-party claims.",
    tip: "Verb form: to indemnify someone *against* something. One of the most negotiated clauses in any contract.",

    situation: "Kvůli přírodní katastrofě jste se odvolali na vyšší moc. Popište to." },

    cs: "To je zajímavý nápad, ale zvažme také —",
    tip: "Adds an alternative without rejecting theirs. Note: “interesting” here is genuinely neutral in American English, unlike British understatement.",
    situation: "Chcete nabídnout jinou možnost, aniž byste odmítli tu jejich.",
    variants: ["I understand your point, but have you thought about...?"] },

  { id: "dis-jump-in", theme: "running-a-meeting", register: "neutral", lessons: [3], date: "2025-02-28",
    en: "Can I jump in quickly?",
    cs: "Můžu rychle vstoupit?",
    tip: "The standard polite interruption. “Jump in” is informal but entirely acceptable in meetings.",
    situation: "Chcete se vložit do diskuze. Udělejte to slušně.",
    variants: ["If I may, I'd like to add...", "Sorry to interrupt, but I think...", "Just a quick point before we move on..."] },

  { id: "dis-let-me-finish", theme: "running-a-meeting", register: "neutral", lessons: [3], date: "2025-02-28",
    en: "Let me finish my thought, and then I'd love to hear yours.",
    cs: "Nechte mě dokončit myšlenku a pak si rád poslechnu tu vaši.",
    tip: "Reclaims the floor without hostility — the promise to listen is what makes it work.",
    situation: "Někdo vás přerušil. Získejte slovo zpět, ale slušně.",
    variants: ["I'll get back to that, but let me complete this point first.", "I'd like to wrap this point up before we move ahead."] },

  { id: "dis-walking-eggshells", theme: "disagreeing-politely", register: "idiom", lessons: [3], date: "2025-02-28",
    en: "walking on eggshells",
    cs: "chodit kolem někoho po špičkách",
    example: "After their recent argument, they were both walking on eggshells, trying to keep the peace.",
    tip: "Describes exhausting over-carefulness around a sensitive person or topic.",
    situation: "Po hádce se všichni chovají přehnaně opatrně. Popište tu atmosféru." },

  { id: "dis-break-deadlock", theme: "negotiating", register: "idiom", lessons: [3], date: "2025-02-28",
    en: "break a deadlock",
    cs: "prolomit patovou situaci",
    example: "The mediator helped the two parties break the deadlock and reach an agreement.",
    tip: "“Deadlock” = neither side can move. Also “break the impasse” in more formal registers.",
    situation: "Jednání uvázlo na mrtvém bodě a mediátor pomohl. Popište to." },

  { id: "dis-clear-the-air", theme: "building-rapport", register: "idiom", lessons: [3], date: "2025-02-28",
    en: "clear the air",
    cs: "vyjasnit si to",
    example: "They decided to have an open conversation to clear the air.",
    tip: "Resolving tension through open conversation. Slightly informal but fine at work.",
    situation: "Chcete otevřeně probrat nedorozumění a uvolnit napětí." },

  { id: "dis-make-amends", theme: "building-rapport", register: "formal", lessons: [3], date: "2025-02-28",
    en: "make amends",
    cs: "napravit to, odčinit",
    example: "She apologized and tried to make amends after their falling-out.",
    tip: "Implies concrete action, not just an apology. “Falling-out” = a serious quarrel.",
    situation: "Po sporu se někdo snaží vztah napravit skutky. Popište to." },

  /* ══════════════════════════════════════════════════════════════════
     LESSON 2 — Running a meeting  (2025-01-10)
     ══════════════════════════════════════════════════════════════════ */

  { id: "meet-get-started", theme: "running-a-meeting", register: "neutral", lessons: [2], date: "2025-01-10",
    en: "Well, it looks like everyone's here, so let's go ahead and get started.",
    cs: "Vypadá to, že jsme všichni, tak pojďme začít.",
    tip: "“Go ahead and” is a very American softener before an instruction — it makes a directive sound collaborative.",
    situation: "Všichni dorazili. Zahajte poradu.",
    variants: ["I think we can get started now.", "Let's dive right in — we have a lot to cover."] },

  { id: "meet-short-notice", theme: "running-a-meeting", register: "client-safe", lessons: [2], date: "2025-01-10",
    en: "Thank you all for coming on such short notice — I really appreciate it.",
    cs: "Děkuji všem, že jste přišli tak narychlo — moc si toho vážím.",
    tip: "“On short notice” is the fixed collocation. Acknowledging the imposition buys goodwill immediately.",
    situation: "Svolali jste poradu na poslední chvíli. Poděkujte za účast." },

  { id: "meet-main-aim", theme: "running-a-meeting", register: "neutral", lessons: [2], date: "2025-01-10",
    en: "Our main aim today is to —",
    cs: "Naším hlavním cílem je dnes —",
    tip: "State the objective early; it gives you the authority to cut tangents later.",
    situation: "Na začátku porady oznamte hlavní cíl.",
    variants: ["We're here today to...", "I've called this meeting in order to..."] },

  { id: "meet-apologies-absent", theme: "running-a-meeting", register: "client-safe", lessons: [2], date: "2025-01-10",
    en: "I'm afraid Dave can't be with us today — he asked me to apologize for his absence.",
    cs: "Bohužel Dave dnes nemůže být s námi — omlouvá se za svou nepřítomnost.",
    tip: "“I'm afraid” is the standard softener for bad news, however minor.",
    situation: "Někdo se nemohl dostavit. Omluvte ho na začátku porady." },

  { id: "meet-go-through-minutes", theme: "running-a-meeting", register: "neutral", lessons: [2], date: "2025-01-10",
    en: "To begin with, I'd like to quickly go through the minutes of our last meeting.",
    cs: "Na úvod bych rychle prošel zápis z minulé porady.",
    tip: "“Minutes” = the written record, always plural. Not “notes” in a formal meeting context.",
    situation: "Chcete na úvod projít zápis z minula." },

  { id: "meet-coming-along", theme: "running-a-meeting", register: "neutral", lessons: [2], date: "2025-01-10",
    en: "Jack, how is the XYZ project coming along?",
    cs: "Jacku, jak to jde s projektem XYZ?",
    tip: "“Coming along” = progressing. Friendlier than “What's the status?” and invites a fuller answer.",
    situation: "Zeptejte se kolegy na postup projektu." },

  { id: "meet-put-out-fire", theme: "running-a-meeting", register: "idiom", lessons: [2], date: "2025-01-10",
    en: "There was a sudden fire at one of his clients, so he had to jump on a call to put it out.",
    cs: "U jednoho klienta vznikl problém, tak musel narychlo na hovor a hasit to.",
    tip: "“Fire” = urgent crisis; “put it out” = resolve it. “Firefighting” describes a whole day of this.",
    situation: "Kolega musel narychlo řešit krizi u klienta. Vysvětlete jeho nepřítomnost." },

  { id: "meet-weekend-smalltalk", theme: "small-talk", register: "casual", lessons: [2], date: "2025-01-10",
    en: "How was your weekend? · How's your day going so far? · How's your workload this week?",
    cs: "Jaký jste měl víkend? · Jak zatím jde den? · Kolik toho máte tento týden?",
    tip: "The standard pre-meeting rotation. “How's your workload?” is the safest work-adjacent option — it invites either complaint or relief.",
    situation: "Před poradou chcete prohodit pár slov s kolegy." },

  { id: "meet-anything-interesting", theme: "small-talk", register: "casual", lessons: [2], date: "2025-01-10",
    en: "Are you working on anything interesting at the moment — that isn't top secret?",
    cs: "Děláte teď na něčem zajímavém — co není přísně tajné?",
    tip: "The joke defuses any confidentiality awkwardness and gives them an easy out. Reliably gets a smile.",
    situation: "Chcete se zeptat na práci někoho, kdo možná nemůže mluvit o detailech." },

  /* ══════════════════════════════════════════════════════════════════
     LESSON 1 — Conference  (2024-12-13)
     ══════════════════════════════════════════════════════════════════ */

  { id: "conf-take-seats", theme: "conference", register: "neutral", lessons: [1], date: "2024-12-13",
    en: "If I could have your attention, please — it's time to get things started.",
    cs: "Mohu poprosit o pozornost — je čas začít.",
    tip: "“If I could have your attention” is the standard formula for quieting a room. Softer than “Attention, please.”",
    situation: "Sál je hlučný a je čas začít konferenci. Získejte pozornost.",
    variants: ["If we could all take our seats now.", "Time to get this show on the road."] },

  { id: "conf-tear-you-away", theme: "conference", register: "casual", lessons: [1], date: "2024-12-13",
    en: "Sorry to tear you away from your conversations, but we need to get things going.",
    cs: "Omlouvám se, že vás vytrhávám z hovorů, ale musíme začít.",
    tip: "“Tear away” acknowledges you're interrupting something enjoyable — warm and self-aware.",
    situation: "Lidé se baví a vy je musíte přerušit, aby konference začala." },

  { id: "conf-kick-things-off", theme: "conference", register: "idiom", lessons: [1], date: "2024-12-13",
    en: "It's my great pleasure to welcome you all — it's time we kicked things off.",
    cs: "Je mi velkým potěšením vás všechny přivítat — je čas to odstartovat.",
    tip: "“Kick off” (from football) = begin. Note the subjunctive “it's time we kicked” — past form after “it's time”.",
    situation: "Zahajujete výroční konferenci. Přivítejte hosty." },

  { id: "conf-food-for-thought", theme: "conference", register: "idiom", lessons: [1], date: "2024-12-13",
    en: "Thank you, John — you've certainly given us a lot of food for thought.",
    cs: "Děkuji, Johne — rozhodně jste nám dal hodně k přemýšlení.",
    tip: "The go-to thank-you for a speaker. Praises without committing you to agreeing with anything they said.",
    situation: "Řečník doskončil. Poděkujte mu a přejděte k dalšímu.",
    variants: ["Thank you for that unique take.", "That was really illuminating."] },

  { id: "conf-riveting", theme: "conference", register: "formal", lessons: [1], date: "2024-12-13",
    en: "What a riveting presentation.",
    cs: "To byla strhující prezentace.",
    tip: "“Riveting” = completely absorbing. Strong praise — save it for when it's deserved, or it sounds hollow.",
    situation: "Prezentace byla vynikající. Pochvalte ji silným slovem." },

  { id: "conf-cover-ground", theme: "conference", register: "idiom", lessons: [1], date: "2024-12-13",
    en: "That was quite a lot to unpack, and you covered a lot of ground in a short time.",
    cs: "Bylo toho hodně k rozebrání a zvládl jste toho pokrýt hodně za krátkou dobu.",
    tip: "“Unpack” = examine in detail; “cover ground” = get through a lot of material. Both very current.",
    situation: "Řečník toho stihl hodně. Oceňte to." },

  { id: "conf-leads-nicely", theme: "conference", register: "neutral", lessons: [1], date: "2024-12-13",
    en: "That leads really nicely into our next speaker, who will touch on some complementary topics.",
    cs: "To krásně navazuje na dalšího řečníka, který se dotkne souvisejících témat.",
    tip: "Note the spelling: *complementary* (completing) — not *complimentary* (praising or free of charge).",
    situation: "Propojte prezentaci s dalším řečníkem." },

  { id: "conf-stretch-legs", theme: "conference", register: "casual", lessons: [1], date: "2024-12-13",
    en: "It's time to take a break and stretch our legs. We'll see you back here in fifteen minutes.",
    cs: "Je čas na přestávku a protáhnout se. Sejdeme se tu za patnáct minut.",
    tip: "“Stretch our legs” is the standard friendly way to announce a break. Always give the exact return time.",
    situation: "Vyhlaste přestávku a řekněte, kdy se vrátit." },

  /* ══════════════════════════════════════════════════════════════════
     LESSON 5 — Pub English / social  (2025-07-25)
     ══════════════════════════════════════════════════════════════════ */

  { id: "pub-no-way", theme: "pub-social", register: "casual", lessons: [5], date: "2025-07-25",
    en: "No way!",
    cs: "Fakt jo? / To si děláš srandu!",
    tip: "Surprise or disbelief, depending on tone. Extremely common — but keep it out of client meetings.",
    situation: "Kamarád vám řekne překvapivou novinku. Zareagujte." },

  { id: "pub-fair-enough", theme: "pub-social", register: "casual", lessons: [5], date: "2025-07-25",
    en: "Fair enough.",
    cs: "To beru. / OK, chápu.",
    tip: "Accepts someone's reasoning without full agreement. Ends a minor disagreement gracefully.",
    situation: "Někdo vysvětlí svůj postoj. Přijměte to, i když nesouhlasíte úplně." },

  { id: "pub-i-feel-you", theme: "pub-social", register: "slang", lessons: [5], date: "2025-07-25",
    en: "I feel you.",
    cs: "Chápu tě. / Vím, jak ti je.",
    tip: "Warm empathy, quite informal. “I hear you” is the safer version for work.",
    situation: "Kamarád si stěžuje na těžké období. Vyjádřete empatii." },

  { id: "pub-im-down", theme: "pub-social", register: "slang", lessons: [5], date: "2025-07-25",
    en: "I'm down. / Count me in.",
    cs: "Jsem pro. / Se mnou počítej.",
    tip: "“I'm down” is casual American; “Count me in” works in any register including work social events.",
    situation: "Kolegové plánují večer. Přidejte se." },

  { id: "pub-swamped", theme: "pub-social", register: "idiom", lessons: [5], date: "2025-07-25",
    en: "I'm swamped.",
    cs: "Mám toho nad hlavu.",
    tip: "Overwhelmed with work. Perfectly acceptable at work — more vivid than “I'm busy”.",
    situation: "Máte příliš mnoho práce. Řekněte to.",
    variants: ["I'm slammed.", "I'm buried."] },

  { id: "pub-wiped-out", theme: "pub-social", register: "casual", lessons: [5], date: "2025-07-25",
    en: "I'm wiped out.",
    cs: "Jsem úplně vyřízený.",
    tip: "Physically exhausted — distinct from “swamped”, which is about workload, not energy.",
    situation: "Jste po náročném dni úplně vyčerpaný. Řekněte to." },

  { id: "pub-same-old", theme: "pub-social", register: "idiom", lessons: [5], date: "2025-07-25",
    en: "Same old, same old.",
    cs: "Pořád to samé.",
    tip: "The standard low-effort answer to “How've you been?” — resigned but good-humored.",
    situation: "Někdo se ptá, co je nového. Nic zvláštního." },

  { id: "pub-nailed-it", theme: "pub-social", register: "casual", lessons: [5], date: "2025-07-25",
    en: "You nailed it!",
    cs: "Zvládl jsi to skvěle!",
    tip: "Enthusiastic praise for a performance or task. Fine in most workplaces, including after a good presentation.",
    situation: "Kolega odvedl skvělou práci. Pochvalte ho." },

  { id: "pub-good-call", theme: "pub-social", register: "casual", lessons: [5], date: "2025-07-25",
    en: "Good call.",
    cs: "Dobré rozhodnutí.",
    tip: "Short praise for a decision. Works equally well at work and socially.",
    situation: "Někdo udělal dobré rozhodnutí. Oceňte to." },

  { id: "pub-got-your-back", theme: "pub-social", register: "idiom", lessons: [5], date: "2025-07-25",
    en: "I've got your back.",
    cs: "Kryju ti záda.",
    tip: "Promise of loyal support. Warm and slightly protective — genuinely meaningful to native speakers.",
    situation: "Kolega je pod tlakem. Ujistěte ho o podpoře." },

  { id: "pub-look-whos-talking", theme: "pub-social", register: "idiom", lessons: [5], date: "2025-07-25",
    en: "Look who's talking!",
    cs: "Kdo to říká!",
    tip: "Ironic — the speaker is guilty of the very thing they're criticizing. Friendly teasing only.",
    situation: "Někdo vás kritizuje za něco, co sám dělá. Odpovězte ironicky.",
    variants: ["You're one to talk."] },

  { id: "pub-just-messing", theme: "pub-social", register: "casual", lessons: [5], date: "2025-07-25",
    en: "I'm just messing with you.",
    cs: "Jen tě tahám za nos.",
    tip: "Defuses a joke that may have landed too hard. “Just kidding” is the neutral alternative.",
    situation: "Zavtipkoval jste a druhý to vzal vážně. Uklidněte ho." },

  { id: "pub-grab-a-drink", theme: "pub-social", register: "casual", lessons: [5], date: "2025-07-25",
    en: "Want to grab a drink later?",
    cs: "Nechceš zajít na drink?",
    tip: "“Grab” is the standard casual verb for informal plans — grab a drink, grab lunch, grab a coffee.",
    situation: "Pozvěte kolegu na drink po práci.",
    variants: ["Let's catch up soon.", "We should do this more often."] },

  /* ══════════════════════════════════════════════════════════════════
     LESSON 6 — Networking  (2025-10-17)
     ══════════════════════════════════════════════════════════════════ */

  { id: "net-mind-if-i-join", theme: "networking", register: "neutral", lessons: [6], date: "2025-10-17",
    en: "Do you mind if I join you? Is this seat taken?",
    cs: "Nevadí, když se přidám? Je tu volno?",
    tip: "The standard two-part approach: ask permission, then remove the obstacle. Asking about the seat gives them an easy, face-saving out.",
    situation: "Na akci chcete přisednout ke skupince lidí. Zeptejte se.",
    variants: ["Would you mind if I sat here?", "Mind if I join?"] },

  { id: "net-get-in-on-this", theme: "networking", register: "casual", lessons: [6], date: "2025-10-17",
    en: "Ooh, I want to get in on this conversation.",
    cs: "Á, do téhle debaty se musím zapojit.",
    tip: "“Get in on” = join something already happening. Playful and flattering — it implies their conversation is worth joining.",
    situation: "Zaslechnete zajímavou debatu a chcete se přidat.",
    variants: ["I couldn't help overhearing — mind if I jump in?"] },

  { id: "net-go-ahead", theme: "networking", register: "casual", lessons: [6], date: "2025-10-17",
    en: "No, no — go ahead.",
    cs: "Ne ne, jen do toho.",
    tip: "The reflexive welcome when someone asks to join or speak. Doubling the “no” makes it warmer, not colder.",
    situation: "Někdo se ptá, jestli se může přidat. Přivítejte ho." },

  { id: "net-havent-met", theme: "networking", register: "neutral", lessons: [6], date: "2025-10-17",
    en: "Hey, I don't think we've met yet — I'm Michal.",
    cs: "Zdravím, myslím, že jsme se ještě nepotkali — já jsem Michal.",
    tip: "The cleanest self-introduction at an event. “I don't think we've met” is softer than “Who are you?” and works even if you have met.",
    situation: "Na konferenci chcete oslovit neznámého člověka a představit se.",
    variants: ["How are you doing? I'm Michal, I'm with SAP."] },

  { id: "net-name-come-up", theme: "networking", register: "client-safe", lessons: [6], date: "2025-10-17",
    en: "Oh, sure — your name has come up a few times. It's great to finally meet you in person.",
    cs: "Jistě — vaše jméno už tu párkrát padlo. Rád vás konečně poznávám osobně.",
    tip: "“Your name has come up” is warmer and less formal than “I've heard about you”. “Finally... in person” flatters without overdoing it.",
    situation: "Potkáte někoho, o kom jste už slyšel. Dejte to najevo mile." },

  { id: "net-just-kidding-great-job", theme: "networking", register: "casual", lessons: [6], date: "2025-10-17",
    en: "Just kidding — I heard you're doing a great job.",
    cs: "Dělám si legraci — slyšel jsem, že odvádíte skvělou práci.",
    tip: "The recovery line after teasing about someone's reputation. Keeps the joke light and ends on a compliment.",
    situation: "Zavtipkoval jste o něčí pověsti. Ujistěte ho, že to bylo v dobrém." },

  { id: "net-what-brings-you", theme: "networking", register: "neutral", lessons: [6], date: "2025-10-17",
    en: "So, what brings you here tonight?",
    cs: "Co vás sem dnes přivádí?",
    tip: "THE classic networking opener. Open-ended, impossible to answer with one word, and works at any event.",
    situation: "Zahajte konverzaci s někým na networkingové akci.",
    variants: ["So how about that last speaker, huh?", "Tough crowd tonight."] },

  { id: "net-where-you-guys-from", theme: "networking", register: "casual", lessons: [6], date: "2025-10-17",
    en: "So where are you guys from?",
    cs: "Odkud jste?",
    tip: "Reliable second question. Note: at a business event this usually means “which company”, not “which country” — context decides.",
    situation: "Chcete se dozvědět, odkud lidé jsou nebo koho zastupují." },

  { id: "net-line-of-work", theme: "networking", register: "client-safe", lessons: [6], date: "2025-10-17",
    en: "Do you mind my asking — how did you get into this line of work?",
    cs: "Můžu se zeptat — jak jste se k téhle práci dostal?",
    tip: "“Do you mind my asking” (not “me asking”) is the polished form. “Line of work” is warmer than “industry” and invites a story.",
    situation: "Chcete se zeptat, jak se někdo dostal ke své profesi.",
    variants: ["That's interesting. How did you get into this line of work?", "What is it that brought you to this line of work?"] },

  { id: "net-fell-into-it", theme: "networking", register: "idiom", lessons: [6], date: "2025-10-17",
    en: "Well, I sort of fell into it.",
    cs: "No, tak nějak jsem do toho spadl.",
    tip: "The modest standard answer — your career happened by accident rather than design. Very common and instantly likeable.",
    situation: "Někdo se ptá, jak jste se dostal ke své práci. Odpovězte skromně.",
    variants: ["I never thought I'd be doing this.", "I never pictured myself in this."] },

  { id: "net-keeps-you-busy", theme: "networking", register: "casual", lessons: [6], date: "2025-10-17",
    en: "Oh, I'll bet that keeps you pretty busy.",
    cs: "To vás musí docela zaměstnávat.",
    tip: "“I'll bet” = I imagine. A warm, low-effort way to show interest and keep them talking about their work.",
    situation: "Někdo popsal náročnou práci. Zareagujte zaujatě." },

  { id: "net-way-you-put-that", theme: "building-rapport", register: "client-safe", lessons: [6], date: "2025-10-17",
    en: "I really like the way you put that.",
    cs: "Moc se mi líbí, jak jste to řekl.",
    tip: "Praises their expression rather than just agreeing — more memorable and more flattering than “I agree”.",
    situation: "Někdo formuloval myšlenku obzvlášť dobře. Oceňte to.",
    variants: ["I couldn't agree more.", "I totally agree."] },

  { id: "net-similar-thing", theme: "building-rapport", register: "casual", lessons: [6], date: "2025-10-17",
    en: "You know what? I had a similar thing happen recently.",
    cs: "Víte co? Nedávno se mi stalo něco podobného.",
    tip: "“You know what?” signals you're about to share something personal — it's how you turn an exchange into a real conversation.",
    situation: "Chcete navázat vlastní zkušeností na to, co protějšek řekl." },

  { id: "net-best-spot-bar", theme: "networking", register: "casual", lessons: [6], date: "2025-10-17",

/* Explicitly publish to the global object. Belt and braces alongside `var`:
   guarantees the app block can see this content in every browser context,
   including iOS Safari where cross-<script> lexical scope has bitten us. */
if (typeof window !== "undefined") {
  window.LESSONS = LESSONS;
  window.PHRASES = PHRASES;
}
