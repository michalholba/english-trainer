  { id: "law-term-sheet", theme: "legal", register: "formal", lessons: [4], date: "2025-05-09",
    en: "term sheet — a non-binding outline of the basic terms of an investment",
    cs: "term sheet / předběžné podmínky investice",
    example: "The term sheet was signed before due diligence began.",
    tip: "Standard in M&A and venture capital. Non-binding, but it frames everything that follows.",
    situation: "Před due diligence jste podepsali základní podmínky. Pojmenujte dokument." },

  { id: "law-indemnity", theme: "legal", register: "formal", lessons: [4], date: "2025-05-09",
    en: "indemnity — an obligation to compensate another party's loss",
    cs: "odškodnění, záruka náhrady škody",
    example: "The supplier agreed to indemnify us against any third-party claims.",
    tip: "Verb form: to indemnify someone *against* something. One of the most negotiated clauses in any contract.",
    situation: "Dodavatel se zavázal krýt vás proti nárokům třetích stran. Popište to." },

  { id: "law-force-majeure", theme: "legal", register: "formal", lessons: [4], date: "2025-05-09",
    en: "force majeure — a clause releasing both parties when an extraordinary event prevents performance",
    cs: "vyšší moc",
    example: "The force majeure clause was invoked due to the natural disaster.",
    tip: "Collocation: a clause is *invoked*, not “used”. Pronounced the French way: fors ma-ZHUR.",
    situation: "Kvůli přírodní katastrofě jste se odvolali na vyšší moc. Popište to." },

  { id: "law-boilerplate", theme: "legal", register: "formal", lessons: [4], date: "2025-05-09",
    en: "boilerplate — standardized contract language",
    cs: "standardní smluvní ustanovení",
    example: "We reviewed the boilerplate clauses to ensure they met our needs.",
    tip: "Slightly dismissive in tone — implies routine text. Reviewing it anyway is exactly where problems hide.",
    situation: "Prošli jste standardní části smlouvy. Popište to." },

  { id: "law-hold-harmless", theme: "legal", register: "formal", lessons: [4], date: "2025-05-09",
    en: "hold harmless clause — a provision releasing one party from liability",
    cs: "doložka o zproštění odpovědnosti",
    example: "The hold harmless clause protects us from claims arising from their use.",
    tip: "Closely related to indemnity: hold harmless prevents the claim, indemnity pays for it.",
    situation: "Doložka vás chrání před nároky z jejich užívání. Pojmenujte ji." },

  { id: "law-escalation-clause", theme: "legal", register: "formal", lessons: [4], date: "2025-05-09",
    en: "escalation clause — a provision allowing price adjustments under set conditions",
    cs: "doložka o úpravě ceny (eskalační doložka)",
    example: "The escalation clause accounts for increases in material costs.",
    tip: "Common in construction and long-term supply contracts where input costs move.",
    situation: "Smlouva umožňuje zvýšit cenu při růstu nákladů. Pojmenujte doložku." },

  /* ══════════════════════════════════════════════════════════════════
     LESSON 3 — Disagreements  (2025-02-28)
     ══════════════════════════════════════════════════════════════════ */

  { id: "dis-respect-different", theme: "disagreeing-politely", register: "client-safe", lessons: [3], date: "2025-02-28",
    en: "I respect your opinion, but I have a different perspective.",
    cs: "Respektuji váš názor, ale mám na to jiný pohled.",
    tip: "The safest disagreement formula: acknowledge, then diverge. Works in almost any professional setting.",
    situation: "Nesouhlasíte s názorem kolegy. Vyjádřete to s respektem.",
    variants: ["I see what you're saying, but I'm not sure I agree.", "You made a good point, but I think..."] },

  { id: "dis-interesting-consider", theme: "disagreeing-politely", register: "client-safe", lessons: [3], date: "2025-02-28",
    en: "That's an interesting idea, but let's also consider —",
    cs: "To je zajímavý nápad, ale zvažme také —",
    tip: "Adds an alternative without rejecting theirs. Note: “interesting” here is genuinely neutral in American English, unlike British understatement.",
    situation: "Chcete nabídnout jinou možnost, aniž byste odmítli tu jejich.",
    variants: ["I understand your point, but have you thought about...?"] },

  { id: "dis-jump-in", theme: "running-a-meeting", register: "neutral", lessons: [3], date: "2025-02-28",
    en: "Can I jump in quickly?",
    cs: "Můžu rychle vstoupit?",
    tip: "The standard polite interruption. “Jump in” is informal but entirely acceptable in meetings.",
    situation: "Chcete se vložit do diskuze. Udělejte to slušně.",
    variants: ["If I may, I'd like to add...", "Sorry to interrupt, but I think...", "Just a quick point before we move on..."] },

  { id: "dis-let-me-finish", theme: "running-a-meeting", register: "neutral", lessons: [3], date: "2025-02-28",
    en: "Let me finish my thought, and then I'd love to hear yours.",
    cs: "Nechte mě dokončit myšlenku a pak si rád poslechnu tu vaši.",
    tip: "Reclaims the floor without hostility — the promise to listen is what makes it work.",
    situation: "Někdo vás přerušil. Získejte slovo zpět, ale slušně.",
    variants: ["I'll get back to that, but let me complete this point first.", "I'd like to wrap this point up before we move ahead."] },

  { id: "dis-walking-eggshells", theme: "disagreeing-politely", register: "idiom", lessons: [3], date: "2025-02-28",
    en: "walking on eggshells",
    cs: "chodit kolem někoho po špičkách",
    example: "After their recent argument, they were both walking on eggshells, trying to keep the peace.",
    tip: "Describes exhausting over-carefulness around a sensitive person or topic.",
    situation: "Po hádce se všichni chovají přehnaně opatrně. Popište tu atmosféru." },

  { id: "dis-break-deadlock", theme: "negotiating", register: "idiom", lessons: [3], date: "2025-02-28",
    en: "break a deadlock",
    cs: "prolomit patovou situaci",
    example: "The mediator helped the two parties break the deadlock and reach an agreement.",
    tip: "“Deadlock” = neither side can move. Also “break the impasse” in more formal registers.",
    situation: "Jednání uvázlo na mrtvém bodě a mediátor pomohl. Popište to." },

  { id: "dis-clear-the-air", theme: "building-rapport", register: "idiom", lessons: [3], date: "2025-02-28",
    en: "clear the air",
    cs: "vyjasnit si to",
    example: "They decided to have an open conversation to clear the air.",
    tip: "Resolving tension through open conversation. Slightly informal but fine at work.",
    situation: "Chcete otevřeně probrat nedorozumění a uvolnit napětí." },

  { id: "dis-make-amends", theme: "building-rapport", register: "formal", lessons: [3], date: "2025-02-28",
    en: "make amends",
    cs: "napravit to, odčinit",
    example: "She apologized and tried to make amends after their falling-out.",
    tip: "Implies concrete action, not just an apology. “Falling-out” = a serious quarrel.",
    situation: "Po sporu se někdo snaží vztah napravit skutky. Popište to." },

  /* ══════════════════════════════════════════════════════════════════
     LESSON 2 — Running a meeting  (2025-01-10)
     ══════════════════════════════════════════════════════════════════ */

  { id: "meet-get-started", theme: "running-a-meeting", register: "neutral", lessons: [2], date: "2025-01-10",
    en: "Well, it looks like everyone's here, so let's go ahead and get started.",
    cs: "Vypadá to, že jsme všichni, tak pojďme začít.",
    tip: "“Go ahead and” is a very American softener before an instruction — it makes a directive sound collaborative.",
    situation: "Všichni dorazili. Zahajte poradu.",
    variants: ["I think we can get started now.", "Let's dive right in — we have a lot to cover."] },

  { id: "meet-short-notice", theme: "running-a-meeting", register: "client-safe", lessons: [2], date: "2025-01-10",
    en: "Thank you all for coming on such short notice — I really appreciate it.",
    cs: "Děkuji všem, že jste přišli tak narychlo — moc si toho vážím.",
    tip: "“On short notice” is the fixed collocation. Acknowledging the imposition buys goodwill immediately.",
    situation: "Svolali jste poradu na poslední chvíli. Poděkujte za účast." },

  { id: "meet-main-aim", theme: "running-a-meeting", register: "neutral", lessons: [2], date: "2025-01-10",
    en: "Our main aim today is to —",
    cs: "Naším hlavním cílem je dnes —",
    tip: "State the objective early; it gives you the authority to cut tangents later.",
    situation: "Na začátku porady oznamte hlavní cíl.",
    variants: ["We're here today to...", "I've called this meeting in order to..."] },

  { id: "meet-apologies-absent", theme: "running-a-meeting", register: "client-safe", lessons: [2], date: "2025-01-10",
    en: "I'm afraid Dave can't be with us today — he asked me to apologize for his absence.",
    cs: "Bohužel Dave dnes nemůže být s námi — omlouvá se za svou nepřítomnost.",
    tip: "“I'm afraid” is the standard softener for bad news, however minor.",
    situation: "Někdo se nemohl dostavit. Omluvte ho na začátku porady." },

  { id: "meet-go-through-minutes", theme: "running-a-meeting", register: "neutral", lessons: [2], date: "2025-01-10",
    en: "To begin with, I'd like to quickly go through the minutes of our last meeting.",
    cs: "Na úvod bych rychle prošel zápis z minulé porady.",
    tip: "“Minutes” = the written record, always plural. Not “notes” in a formal meeting context.",
    situation: "Chcete na úvod projít zápis z minula." },

  { id: "meet-coming-along", theme: "running-a-meeting", register: "neutral", lessons: [2], date: "2025-01-10",
    en: "Jack, how is the XYZ project coming along?",
    cs: "Jacku, jak to jde s projektem XYZ?",
    tip: "“Coming along” = progressing. Friendlier than “What's the status?” and invites a fuller answer.",
    situation: "Zeptejte se kolegy na postup projektu." },

  { id: "meet-put-out-fire", theme: "running-a-meeting", register: "idiom", lessons: [2], date: "2025-01-10",
    en: "There was a sudden fire at one of his clients, so he had to jump on a call to put it out.",
    cs: "U jednoho klienta vznikl problém, tak musel narychlo na hovor a hasit to.",
    tip: "“Fire” = urgent crisis; “put it out” = resolve it. “Firefighting” describes a whole day of this.",
    situation: "Kolega musel narychlo řešit krizi u klienta. Vysvětlete jeho nepřítomnost." },

  { id: "meet-weekend-smalltalk", theme: "small-talk", register: "casual", lessons: [2], date: "2025-01-10",
    en: "How was your weekend? · How's your day going so far? · How's your workload this week?",
    cs: "Jaký jste měl víkend? · Jak zatím jde den? · Kolik toho máte tento týden?",
    tip: "The standard pre-meeting rotation. “How's your workload?” is the safest work-adjacent option — it invites either complaint or relief.",
    situation: "Před poradou chcete prohodit pár slov s kolegy." },

  { id: "meet-anything-interesting", theme: "small-talk", register: "casual", lessons: [2], date: "2025-01-10",
    en: "Are you working on anything interesting at the moment — that isn't top secret?",
    cs: "Děláte teď na něčem zajímavém — co není přísně tajné?",
    tip: "The joke defuses any confidentiality awkwardness and gives them an easy out. Reliably gets a smile.",
    situation: "Chcete se zeptat na práci někoho, kdo možná nemůže mluvit o detailech." },

  /* ══════════════════════════════════════════════════════════════════
     LESSON 1 — Conference  (2024-12-13)
     ══════════════════════════════════════════════════════════════════ */

  { id: "conf-take-seats", theme: "conference", register: "neutral", lessons: [1], date: "2024-12-13",
    en: "If I could have your attention, please — it's time to get things started.",
    cs: "Mohu poprosit o pozornost — je čas začít.",
    tip: "“If I could have your attention” is the standard formula for quieting a room. Softer than “Attention, please.”",
    situation: "Sál je hlučný a je čas začít konferenci. Získejte pozornost.",
    variants: ["If we could all take our seats now.", "Time to get this show on the road."] },

  { id: "conf-tear-you-away", theme: "conference", register: "casual", lessons: [1], date: "2024-12-13",
    en: "Sorry to tear you away from your conversations, but we need to get things going.",
    cs: "Omlouvám se, že vás vytrhávám z hovorů, ale musíme začít.",
    tip: "“Tear away” acknowledges you're interrupting something enjoyable — warm and self-aware.",
    situation: "Lidé se baví a vy je musíte přerušit, aby konference začala." },

  { id: "conf-kick-things-off", theme: "conference", register: "idiom", lessons: [1], date: "2024-12-13",
    en: "It's my great pleasure to welcome you all — it's time we kicked things off.",
    cs: "Je mi velkým potěšením vás všechny přivítat — je čas to odstartovat.",
    tip: "“Kick off” (from football) = begin. Note the subjunctive “it's time we kicked” — past form after “it's time”.",
    situation: "Zahajujete výroční konferenci. Přivítejte hosty." },

  { id: "conf-food-for-thought", theme: "conference", register: "idiom", lessons: [1], date: "2024-12-13",
    en: "Thank you, John — you've certainly given us a lot of food for thought.",
    cs: "Děkuji, Johne — rozhodně jste nám dal hodně k přemýšlení.",
    tip: "The go-to thank-you for a speaker. Praises without committing you to agreeing with anything they said.",
    situation: "Řečník doskončil. Poděkujte mu a přejděte k dalšímu.",
    variants: ["Thank you for that unique take.", "That was really illuminating."] },

  { id: "conf-riveting", theme: "conference", register: "formal", lessons: [1], date: "2024-12-13",
    en: "What a riveting presentation.",
    cs: "To byla strhující prezentace.",
    tip: "“Riveting” = completely absorbing. Strong praise — save it for when it's deserved, or it sounds hollow.",
    situation: "Prezentace byla vynikající. Pochvalte ji silným slovem." },

  { id: "conf-cover-ground", theme: "conference", register: "idiom", lessons: [1], date: "2024-12-13",
    en: "That was quite a lot to unpack, and you covered a lot of ground in a short time.",
    cs: "Bylo toho hodně k rozebrání a zvládl jste toho pokrýt hodně za krátkou dobu.",
    tip: "“Unpack” = examine in detail; “cover ground” = get through a lot of material. Both very current.",
    situation: "Řečník toho stihl hodně. Oceňte to." },

  { id: "conf-leads-nicely", theme: "conference", register: "neutral", lessons: [1], date: "2024-12-13",
    en: "That leads really nicely into our next speaker, who will touch on some complementary topics.",
    cs: "To krásně navazuje na dalšího řečníka, který se dotkne souvisejících témat.",
    tip: "Note the spelling: *complementary* (completing) — not *complimentary* (praising or free of charge).",
    situation: "Propojte prezentaci s dalším řečníkem." },

  { id: "conf-stretch-legs", theme: "conference", register: "casual", lessons: [1], date: "2024-12-13",
    en: "It's time to take a break and stretch our legs. We'll see you back here in fifteen minutes.",
    cs: "Je čas na přestávku a protáhnout se. Sejdeme se tu za patnáct minut.",
    tip: "“Stretch our legs” is the standard friendly way to announce a break. Always give the exact return time.",
    situation: "Vyhlaste přestávku a řekněte, kdy se vrátit." },

  /* ══════════════════════════════════════════════════════════════════
     LESSON 5 — Pub English / social  (2025-07-25)
     ══════════════════════════════════════════════════════════════════ */

  { id: "pub-no-way", theme: "pub-social", register: "casual", lessons: [5], date: "2025-07-25",
    en: "No way!",
    cs: "Fakt jo? / To si děláš srandu!",
    tip: "Surprise or disbelief, depending on tone. Extremely common — but keep it out of client meetings.",
    situation: "Kamarád vám řekne překvapivou novinku. Zareagujte." },

  { id: "pub-fair-enough", theme: "pub-social", register: "casual", lessons: [5], date: "2025-07-25",
    en: "Fair enough.",
    cs: "To beru. / OK, chápu.",
    tip: "Accepts someone's reasoning without full agreement. Ends a minor disagreement gracefully.",
    situation: "Někdo vysvětlí svůj postoj. Přijměte to, i když nesouhlasíte úplně." },

  { id: "pub-i-feel-you", theme: "pub-social", register: "slang", lessons: [5], date: "2025-07-25",
    en: "I feel you.",
    cs: "Chápu tě. / Vím, jak ti je.",
    tip: "Warm empathy, quite informal. “I hear you” is the safer version for work.",
    situation: "Kamarád si stěžuje na těžké období. Vyjádřete empatii." },

  { id: "pub-im-down", theme: "pub-social", register: "slang", lessons: [5], date: "2025-07-25",
    en: "I'm down. / Count me in.",
    cs: "Jsem pro. / Se mnou počítej.",
    tip: "“I'm down” is casual American; “Count me in” works in any register including work social events.",
    situation: "Kolegové plánují večer. Přidejte se." },

  { id: "pub-swamped", theme: "pub-social", register: "idiom", lessons: [5], date: "2025-07-25",
    en: "I'm swamped.",
    cs: "Mám toho nad hlavu.",
    tip: "Overwhelmed with work. Perfectly acceptable at work — more vivid than “I'm busy”.",
    situation: "Máte příliš mnoho práce. Řekněte to.",
    variants: ["I'm slammed.", "I'm buried."] },

  { id: "pub-wiped-out", theme: "pub-social", register: "casual", lessons: [5], date: "2025-07-25",
    en: "I'm wiped out.",
    cs: "Jsem úplně vyřízený.",
    tip: "Physically exhausted — distinct from “swamped”, which is about workload, not energy.",
    situation: "Jste po náročném dni úplně vyčerpaný. Řekněte to." },

  { id: "pub-same-old", theme: "pub-social", register: "idiom", lessons: [5], date: "2025-07-25",
    en: "Same old, same old.",
    cs: "Pořád to samé.",
    tip: "The standard low-effort answer to “How've you been?” — resigned but good-humored.",
    situation: "Někdo se ptá, co je nového. Nic zvláštního." },

  { id: "pub-nailed-it", theme: "pub-social", register: "casual", lessons: [5], date: "2025-07-25",
    en: "You nailed it!",
    cs: "Zvládl jsi to skvěle!",
    tip: "Enthusiastic praise for a performance or task. Fine in most workplaces, including after a good presentation.",
    situation: "Kolega odvedl skvělou práci. Pochvalte ho." },

  { id: "pub-good-call", theme: "pub-social", register: "casual", lessons: [5], date: "2025-07-25",
    en: "Good call.",
    cs: "Dobré rozhodnutí.",
    tip: "Short praise for a decision. Works equally well at work and socially.",
    situation: "Někdo udělal dobré rozhodnutí. Oceňte to." },

  { id: "pub-got-your-back", theme: "pub-social", register: "idiom", lessons: [5], date: "2025-07-25",
    en: "I've got your back.",
    cs: "Kryju ti záda.",
    tip: "Promise of loyal support. Warm and slightly protective — genuinely meaningful to native speakers.",
    situation: "Kolega je pod tlakem. Ujistěte ho o podpoře." },

  { id: "pub-look-whos-talking", theme: "pub-social", register: "idiom", lessons: [5], date: "2025-07-25",
    en: "Look who's talking!",
    cs: "Kdo to říká!",
    tip: "Ironic — the speaker is guilty of the very thing they're criticizing. Friendly teasing only.",
    situation: "Někdo vás kritizuje za něco, co sám dělá. Odpovězte ironicky.",
    variants: ["You're one to talk."] },

  { id: "pub-just-messing", theme: "pub-social", register: "casual", lessons: [5], date: "2025-07-25",
    en: "I'm just messing with you.",
    cs: "Jen tě tahám za nos.",
    tip: "Defuses a joke that may have landed too hard. “Just kidding” is the neutral alternative.",
    situation: "Zavtipkoval jste a druhý to vzal vážně. Uklidněte ho." },

  { id: "pub-grab-a-drink", theme: "pub-social", register: "casual", lessons: [5], date: "2025-07-25",
    en: "Want to grab a drink later?",
    cs: "Nechceš zajít na drink?",
    tip: "“Grab” is the standard casual verb for informal plans — grab a drink, grab lunch, grab a coffee.",
    situation: "Pozvěte kolegu na drink po práci.",
    variants: ["Let's catch up soon.", "We should do this more often."] },

  /* ══════════════════════════════════════════════════════════════════
     LESSON 6 — Networking  (2025-10-17)
     ══════════════════════════════════════════════════════════════════ */

  { id: "net-mind-if-i-join", theme: "networking", register: "neutral", lessons: [6], date: "2025-10-17",
    en: "Do you mind if I join you? Is this seat taken?",
    cs: "Nevadí, když se přidám? Je tu volno?",
    tip: "The standard two-part approach: ask permission, then remove the obstacle. Asking about the seat gives them an easy, face-saving out.",
    situation: "Na akci chcete přisednout ke skupince lidí. Zeptejte se.",
    variants: ["Would you mind if I sat here?", "Mind if I join?"] },

  { id: "net-get-in-on-this", theme: "networking", register: "casual", lessons: [6], date: "2025-10-17",
    en: "Ooh, I want to get in on this conversation.",
    cs: "Á, do téhle debaty se musím zapojit.",
    tip: "“Get in on” = join something already happening. Playful and flattering — it implies their conversation is worth joining.",
    situation: "Zaslechnete zajímavou debatu a chcete se přidat.",
    variants: ["I couldn't help overhearing — mind if I jump in?"] },

  { id: "net-go-ahead", theme: "networking", register: "casual", lessons: [6], date: "2025-10-17",
    en: "No, no — go ahead.",
    cs: "Ne ne, jen do toho.",
    tip: "The reflexive welcome when someone asks to join or speak. Doubling the “no” makes it warmer, not colder.",
    situation: "Někdo se ptá, jestli se může přidat. Přivítejte ho." },

  { id: "net-havent-met", theme: "networking", register: "neutral", lessons: [6], date: "2025-10-17",
    en: "Hey, I don't think we've met yet — I'm Michal.",
    cs: "Zdravím, myslím, že jsme se ještě nepotkali — já jsem Michal.",
    tip: "The cleanest self-introduction at an event. “I don't think we've met” is softer than “Who are you?” and works even if you have met.",
    situation: "Na konferenci chcete oslovit neznámého člověka a představit se.",
    variants: ["How are you doing? I'm Michal, I'm with SAP."] },

  { id: "net-name-come-up", theme: "networking", register: "client-safe", lessons: [6], date: "2025-10-17",
    en: "Oh, sure — your name has come up a few times. It's great to finally meet you in person.",
    cs: "Jistě — vaše jméno už tu párkrát padlo. Rád vás konečně poznávám osobně.",
    tip: "“Your name has come up” is warmer and less formal than “I've heard about you”. “Finally... in person” flatters without overdoing it.",
    situation: "Potkáte někoho, o kom jste už slyšel. Dejte to najevo mile." },

  { id: "net-just-kidding-great-job", theme: "networking", register: "casual", lessons: [6], date: "2025-10-17",
    en: "Just kidding — I heard you're doing a great job.",
    cs: "Dělám si legraci — slyšel jsem, že odvádíte skvělou práci.",
    tip: "The recovery line after teasing about someone's reputation. Keeps the joke light and ends on a compliment.",
    situation: "Zavtipkoval jste o něčí pověsti. Ujistěte ho, že to bylo v dobrém." },

  { id: "net-what-brings-you", theme: "networking", register: "neutral", lessons: [6], date: "2025-10-17",
    en: "So, what brings you here tonight?",
    cs: "Co vás sem dnes přivádí?",
    tip: "THE classic networking opener. Open-ended, impossible to answer with one word, and works at any event.",
    situation: "Zahajte konverzaci s někým na networkingové akci.",
    variants: ["So how about that last speaker, huh?", "Tough crowd tonight."] },

  { id: "net-where-you-guys-from", theme: "networking", register: "casual", lessons: [6], date: "2025-10-17",
    en: "So where are you guys from?",
    cs: "Odkud jste?",
    tip: "Reliable second question. Note: at a business event this usually means “which company”, not “which country” — context decides.",
    situation: "Chcete se dozvědět, odkud lidé jsou nebo koho zastupují." },

  { id: "net-line-of-work", theme: "networking", register: "client-safe", lessons: [6], date: "2025-10-17",
    en: "Do you mind my asking — how did you get into this line of work?",
    cs: "Můžu se zeptat — jak jste se k téhle práci dostal?",
    tip: "“Do you mind my asking” (not “me asking”) is the polished form. “Line of work” is warmer than “industry” and invites a story.",
    situation: "Chcete se zeptat, jak se někdo dostal ke své profesi.",
    variants: ["That's interesting. How did you get into this line of work?", "What is it that brought you to this line of work?"] },

  { id: "net-fell-into-it", theme: "networking", register: "idiom", lessons: [6], date: "2025-10-17",
    en: "Well, I sort of fell into it.",
    cs: "No, tak nějak jsem do toho spadl.",
    tip: "The modest standard answer — your career happened by accident rather than design. Very common and instantly likeable.",
    situation: "Někdo se ptá, jak jste se dostal ke své práci. Odpovězte skromně.",
    variants: ["I never thought I'd be doing this.", "I never pictured myself in this."] },

  { id: "net-keeps-you-busy", theme: "networking", register: "casual", lessons: [6], date: "2025-10-17",
    en: "Oh, I'll bet that keeps you pretty busy.",
    cs: "To vás musí docela zaměstnávat.",
    tip: "“I'll bet” = I imagine. A warm, low-effort way to show interest and keep them talking about their work.",
    situation: "Někdo popsal náročnou práci. Zareagujte zaujatě." },

  { id: "net-way-you-put-that", theme: "building-rapport", register: "client-safe", lessons: [6], date: "2025-10-17",
    en: "I really like the way you put that.",
    cs: "Moc se mi líbí, jak jste to řekl.",
    tip: "Praises their expression rather than just agreeing — more memorable and more flattering than “I agree”.",
    situation: "Někdo formuloval myšlenku obzvlášť dobře. Oceňte to.",
    variants: ["I couldn't agree more.", "I totally agree."] },

  { id: "net-similar-thing", theme: "building-rapport", register: "casual", lessons: [6], date: "2025-10-17",
    en: "You know what? I had a similar thing happen recently.",
    cs: "Víte co? Nedávno se mi stalo něco podobného.",
    tip: "“You know what?” signals you're about to share something personal — it's how you turn an exchange into a real conversation.",
    situation: "Chcete navázat vlastní zkušeností na to, co protějšek řekl." },

  { id: "net-best-spot-bar", theme: "networking", register: "casual", lessons: [6], date: "2025-10-17",
    en: "You've got the best spot — right by the bar!",
    cs: "Máte nejlepší místo — hned u baru!",
    tip: "Light opener with a built-in compliment and a joke. Low-risk way to start talking to strangers at a reception.",
    situation: "Chcete odlehčeně oslovit někoho, kdo stojí u baru." },

  { id: "net-how-finding-event", theme: "networking", register: "neutral", lessons: [6], date: "2025-10-17",
    en: "How are you finding the event so far?",
    cs: "Jak se vám akce zatím líbí?",
    original: "How do you find it?",
    tip: "IMPORTANT: “How are you finding it?” (continuous) asks about an ongoing experience. “How do you find it?” sounds odd here — your note flagged this as wrong, and it is.",
    situation: "Zeptejte se někoho, jak se mu akce zatím líbí." },

  { id: "net-usually-find-dull", theme: "networking", register: "casual", lessons: [6], date: "2025-10-17",
    en: "I'm actually really enjoying myself. Usually I find these things a little dull, if I'm being honest, but this one is actually good.",
    cs: "Vlastně se docela bavím. Obvykle mi tyhle akce přijdou nudné, ale tahle je fakt dobrá.",
    tip: "“If I'm being honest” licenses a mild criticism and makes the compliment that follows sound sincere rather than polite.",
    situation: "Akce se vám nečekaně líbí. Řekněte to upřímně." },

  { id: "net-getting-through-it", theme: "networking", register: "casual", lessons: [6], date: "2025-10-17",
    en: "Oh, I'm getting through it. Honestly, I've been to ones I enjoyed more — but we're only halfway through.",
    cs: "Zvládám to. Popravdě jsem byl na lepších — ale jsme teprve v půlce.",
    tip: "Diplomatic negativity: “getting through it” admits boredom without complaining, and the ending leaves room for optimism.",
    situation: "Akce vás nebaví, ale nechcete být nezdvořilý. Odpovězte diplomaticky." },

  { id: "net-stay-in-touch", theme: "networking", register: "client-safe", lessons: [6], date: "2025-10-17",
    en: "I'd love to stay in touch — if there's ever a chance to collaborate in the future.",
    cs: "Rád bych zůstal v kontaktu — kdyby se někdy naskytla příležitost spolupracovat.",
    tip: "The standard close. Vague enough to be non-committal, specific enough to signal genuine interest.",
    situation: "Rozhovor byl přínosný. Navrhněte, ať zůstanete v kontaktu." },

  { id: "net-keep-it-in-mind", theme: "networking", register: "neutral", lessons: [6], date: "2025-10-17",
    en: "Yeah, I'll keep it in mind.",
    cs: "Jasně, budu to mít na paměti.",
    tip: "Polite acceptance without commitment. Native speakers often read this as a soft no — useful in both directions.",
    situation: "Někdo vám něco nabídl. Přijměte to zdvořile, bez závazku." },

  { id: "net-let-you-mingle", theme: "networking", register: "client-safe", lessons: [6], date: "2025-10-17",
    en: "Hey, it's been great talking with you — I'll let you mingle a little bit.",
    cs: "Bylo mi potěšením — nechám vás, ať se ještě protočíte mezi lidmi.",
    tip: "The single most useful networking exit. Framed as a favor to THEM, so nobody loses face. “Mingle” is the exact verb for working a room.",
    situation: "Chcete slušně ukončit rozhovor a jít dál." },

  { id: "net-make-the-rounds", theme: "networking", register: "idiom", lessons: [6], date: "2025-10-17",
    en: "This was fun. I'm going to make the rounds a bit, but great meeting you.",
    cs: "Bylo to fajn. Ještě se tu projdu mezi lidmi, ale rád jsem vás poznal.",
    tip: "“Make the rounds” = circulate around the room. An honest, socially accepted reason to leave a conversation.",
    situation: "Chcete se rozloučit a jít se bavit s dalšími lidmi.",
    variants: ["I'm going to do a lap around the room.", "I need to circle around a bit."] },

  { id: "net-take-up-all-your-time", theme: "networking", register: "client-safe", lessons: [6], date: "2025-10-17",
    en: "Anyway, I don't want to take up all your time. Really nice talking to you.",
    cs: "Každopádně nechci vám zabírat celý večer. Bylo moc fajn si popovídat.",
    tip: "Exits by appearing considerate of their time. “Anyway” is the classic signal that a conversation is wrapping up.",
    situation: "Rozhovor trvá dlouho. Ukončete ho ohleduplně.",
    variants: ["Likewise.", "Yeah, you too."] },

  { id: "net-pick-this-up-later", theme: "networking", register: "neutral", lessons: [6], date: "2025-10-17",
    en: "Can we pick this up later? I really don't want to cut you off, but I've got to get to my next one.",
    cs: "Můžeme na to navázat později? Nerad vás přerušuju, ale musím na další schůzku.",
    tip: "“Pick this up later” promises continuation, which softens the interruption. Note “cut you off” = interrupt (correct here).",
    situation: "Musíte odejít uprostřed dobrého rozhovoru. Navrhněte pokračování." },

  { id: "net-pick-your-brain", theme: "networking", register: "idiom", lessons: [6], date: "2025-10-17",
    en: "Do you mind if I pick your brain real quick?",
    cs: "Nevadilo by vám, kdybych se na něco rychle zeptal?",
    tip: "“Pick your brain” = ask for expert advice informally. Flattering — it treats them as the expert. “Real quick” lowers the commitment.",
    situation: "Chcete někoho požádat o radu, ale nezabrat mu moc času.",
    variants: ["I'm sure you're busy, but do you mind if I ask you something real quick?"] },

  { id: "net-congrats-on-deal", theme: "networking", register: "casual", lessons: [6], date: "2025-10-17",
    en: "Hey, congrats on your deal at —!",
    cs: "Gratuluju k tomu obchodu s —!",
    tip: "Naming a specific achievement proves you follow their work. Far more effective than generic praise.",
    situation: "Chcete pogratulovat k nedávnému úspěchu, o kterém jste slyšel." },

  { id: "net-thats-annoying", theme: "building-rapport", register: "casual", lessons: [6], date: "2025-10-17",
    en: "That's annoying, isn't it?",
    cs: "To je otravné, viďte?",
    tip: "The tag question invites agreement and builds quick solidarity over a shared frustration.",
    situation: "Sdílíte s někým drobnou frustraci. Vyjádřete to a pozvěte souhlas." },

  { id: "net-how-are-they-looking", theme: "small-talk", register: "casual", lessons: [6], date: "2025-10-17",
    en: "How are the Raiders looking this season?",
    cs: "Jak to letos vypadá s Raiders?",
    tip: "Sport is the safest American small-talk topic. “How are they looking?” works for any team without requiring you to know much.",
    situation: "Chcete začít small talk o sportu.",
    variants: ["Did you see the game last night?", "How about those Niners?"] },

  { id: "net-havent-been-following", theme: "small-talk", register: "casual", lessons: [6], date: "2025-10-17",
    en: "I haven't really been following, to be honest.",
    cs: "Popravdě to moc nesleduju.",
    tip: "The graceful way out when sport comes up and you have nothing. Pair it with a question back to keep the conversation moving.",
    situation: "Někdo mluví o sportu, kterému nerozumíte. Přiznejte to elegantně." },

  { id: "net-not-setting-hopes-up", theme: "small-talk", register: "idiom", lessons: [6], date: "2025-10-17",
    en: "I hope we'll make the playoffs, but I'm not getting my hopes up.",
    cs: "Doufám, že se dostaneme do playoff, ale moc si od toho neslibuju.",
    tip: "“Make the playoffs” is the fixed collocation. “Not getting my hopes up” = guarding against disappointment — useful well beyond sport.",
    situation: "Doufáte v úspěch, ale nechcete být příliš optimistický.",
    variants: ["I'm not holding my breath."] },

  { id: "net-not-himself", theme: "small-talk", register: "neutral", lessons: [6], date: "2025-10-17",
    en: "He's back, but he's not really himself yet.",
    cs: "Je zpátky, ale ještě není ve své kůži.",
    tip: "“Not himself” = not at his usual standard, after injury or illness. Works for colleagues as much as athletes.",
    situation: "Někdo se vrátil po zranění, ale nemá formu. Popište to." },

  { id: "net-usual-suspects", theme: "small-talk", register: "idiom", lessons: [6], date: "2025-10-17",
    en: "You know, I like it when the usual suspects are struggling a bit — anybody can win it.",
    cs: "Mám rád, když se favoritům nedaří — pak to může vyhrát kdokoli.",
    tip: "“The usual suspects” = the predictable big names. Slightly ironic and very idiomatic, in sport and in business.",
    situation: "Favorité mají slabší sezónu a vás to baví. Vyjádřete to." },

  /* ══════════════════════════════════════════════════════════════════
     LESSON 12 — Everyday phrases I / phrasal verbs  (2021-01-21)
     ══════════════════════════════════════════════════════════════════ */

  { id: "ev-rabbit-hole", theme: "phrasal-verbs", register: "idiom", lessons: [12], date: "2021-01-21",
    en: "Let's not go down that rabbit hole.",
    cs: "Nepouštějme se do toho — je to bezedná díra.",
    example: "Guys, let's keep this simple and not go down that rabbit hole.",
    tip: "A tangent that swallows far more time than expected. Very common in meetings. Note the fixed preposition: go *down* a rabbit hole.",
    situation: "Diskuze míří k tématu, které by zabralo hodiny. Zarazte to." },

  { id: "ev-cross-my-mind", theme: "phrasal-verbs", register: "neutral", lessons: [12], date: "2021-01-21",
    en: "It crossed my mind that she might not come.",
    cs: "Napadlo mě, že možná nepřijde.",
    tip: "“Cross my mind” describes a thought arriving unbidden — almost always about a past moment, and usually paired with *when*.",
    situation: "Během jízdy vás napadla myšlenka. Popište to." },

  { id: "ev-came-to-mind", theme: "phrasal-verbs", register: "neutral", lessons: [12], date: "2021-01-21",
    en: "Something just came to mind. / Something just occurred to me.",
    cs: "Něco mě právě napadlo.",
    original: "something just came on my mind",
    tip: "It's “came TO mind”, never “came on my mind”. “It occurred to me” is the slightly more formal twin — both are about a thought arriving right now.",
    situation: "Právě vás něco napadlo a chcete to hned říct.",
    variants: ["I just had a thought.", "I just thought of something.", "You know what I just remembered?"] },

  { id: "ev-take-after", theme: "phrasal-verbs", register: "neutral", lessons: [12], date: "2021-01-21",
    en: "He takes after his dad.",
    cs: "Je po tátovi.",
    tip: "Resemblance in looks or character, only ever about family. Don't confuse with “look after” = take care of.",
    situation: "Někdo se povahou i vzhledem podobá svému otci. Řekněte to." },

  { id: "ev-look-after", theme: "phrasal-verbs", register: "neutral", lessons: [12], date: "2021-01-21",
    en: "Could you look after the kids while I'm out?",
    cs: "Pohlídal bys děti, než se vrátím?",
    tip: "“Look after” = take care of. Distinct from “take after” (resemble) and “look up” (search for) — three very different phrasal verbs.",
    situation: "Potřebujete, aby někdo pohlídal děti." },

  { id: "ev-let-go", theme: "phrasal-verbs", register: "client-safe", lessons: [12], date: "2021-01-21",
    en: "We had to let him go.",
    cs: "Museli jsme se s ním rozloučit (propustit ho).",
    tip: "The standard euphemism for firing someone — softer than “we fired him”. Separately, “let it go” means stop dwelling on something.",
    situation: "Museli jste propustit zaměstnance. Řekněte to šetrně." },

  { id: "ev-flip-out", theme: "phrasal-verbs", register: "casual", lessons: [12], date: "2021-01-21",
    en: "He completely flipped out.",
    cs: "Úplně se zbláznil / vyletěl z kůže.",
    tip: "Lose control emotionally. “Freak out” is the near-synonym and slightly more common in American English.",
    situation: "Někdo zareagoval naprosto nepřiměřeně a vybuchl." },

  { id: "ev-figure-out", theme: "phrasal-verbs", register: "neutral", lessons: [12], date: "2021-01-21",
    en: "I couldn't figure out the answers to half the questions.",
    cs: "Nedokázal jsem přijít na odpovědi ani na polovinu otázek.",
    tip: "“Figure out” = work out a solution. Plain “figure” alone means assume: “I figured you'd be here.”",
    situation: "Nedokázali jste vyřešit většinu úkolu. Řekněte to." },

  { id: "ev-figured", theme: "phrasal-verbs", register: "casual", lessons: [12], date: "2021-01-21",
    en: "I figured you'd be here.",
    cs: "Říkal jsem si, že tu budeš.",
    tip: "“I figured” = I assumed / I reckoned. Extremely common in spoken American English and quite different from “figure out”.",
    situation: "Předpokládali jste, že tam někdo bude — a byl." },

  { id: "ev-show-around", theme: "phrasal-verbs", register: "client-safe", lessons: [12], date: "2021-01-21",
    en: "If you ever come to Prague, I'd be happy to show you around.",
    cs: "Kdybyste někdy přijeli do Prahy, rád vás provedu.",
    tip: "The natural way to offer hospitality to a visiting colleague or client. Warm without being over-committing.",
    situation: "Nabídněte zahraničnímu kolegovi, že mu ukážete své město." },

  { id: "ev-ask-over", theme: "phrasal-verbs", register: "casual", lessons: [12], date: "2021-01-21",
    en: "We should ask them over for dinner.",
    cs: "Měli bychom je pozvat k nám na večeři.",
    tip: "“Ask/have someone over” = invite to your home. “Ask them out” means invite them out — and in the singular usually implies a date.",
    situation: "Chcete pozvat přátele k sobě domů na večeři." },

  { id: "ev-hang-out", theme: "phrasal-verbs", register: "casual", lessons: [12], date: "2021-01-21",
    en: "We just hung out last night.",
    cs: "Jen jsme se tak poflakovali.",
    tip: "Spend relaxed time together with no particular plan. Past tense is *hung*, not *hanged*.",
    situation: "Popište nezávazně strávený večer s přáteli." },

  { id: "ev-gonna-chill", theme: "phrasal-verbs", register: "casual", lessons: [12], date: "2021-01-21",
    en: "I think I'm just going to chill at the hotel — I've got an early flight.",
    cs: "Asi zůstanu v hotelu a odpočinu si — mám brzy ráno let.",
    tip: "The graceful decline on a business trip: give a reason and it never reads as rejection.",
    situation: "Kolegové vás zvou ven, ale vy chcete zůstat v hotelu. Odmítněte mile.",
    variants: ["I'd love to, but I've got some work I need to finish.", "I wish I could."] },

  { id: "ev-mess-up", theme: "phrasal-verbs", register: "casual", lessons: [12], date: "2021-01-21",
    en: "Sorry, I messed up.",
    cs: "Promiň, zpackal jsem to.",
    tip: "The clean, professional way to own a mistake. Note the family: “mess up” = make a mistake, “don't mess with me” = don't provoke me, “a mess” = chaos.",
    situation: "Udělali jste chybu. Přiznejte ji bez vytáček." },

  { id: "ev-bring-up-children", theme: "phrasal-verbs", register: "neutral", lessons: [12], date: "2021-01-21",
    en: "She was brought up in Prague.",
    cs: "Vyrostla v Praze.",
    tip: "“Bring up” = raise a child. It also means introduce a topic — “I didn't want to bring it up in the meeting.”",
    situation: "Řekněte, kde někdo vyrůstal." },

  { id: "ev-thrilled", theme: "small-talk", register: "idiom", lessons: [12], date: "2021-01-21",
    en: "I couldn't be more thrilled for you.",
    cs: "Nemohl bych mít větší radost.",
    tip: "Warm, genuine congratulation. Careful with tone — “I'm sure he'd be thrilled” is a stock sarcastic line.",
    situation: "Kolega dostal povýšení. Vyjádřete upřímnou radost." },

  { id: "ev-had-better", theme: "grammar-traps", register: "neutral", lessons: [12], date: "2021-01-21",
    en: "I'd better get going. / I had better call her.",
    cs: "Měl bych už jít. / Radši jí zavolám.",
    tip: "ALWAYS the past form “had better” + a present-tense verb, even about the future. Never “I have better”. Usually contracted to “I'd better”.",
    situation: "Je čas odejít. Řekněte to přirozeně." },

  /* ══════════════════════════════════════════════════════════════════
     LESSON 13 — Everyday phrases II / follow-up  (2023-12-08)
     ══════════════════════════════════════════════════════════════════ */

  { id: "ev2-nothing-pressing", theme: "business-email", register: "client-safe", lessons: [13], date: "2023-12-08",
    en: "I don't have any pressing topics at the moment.",
    cs: "Nemám teď nic naléhavého.",
    tip: "“Pressing” = urgent, can't wait. The polite way to say a meeting isn't needed without sounding dismissive.",
    situation: "Nemáte nic urgentního a chcete navrhnout, ať se sejdete příště.",
    variants: ["There's nothing pressing at the moment.", "Nothing that can't wait till next time."] },

  { id: "ev2-catch-up-next-time", theme: "business-email", register: "client-safe", lessons: [13], date: "2023-12-08",
    en: "Let's postpone and catch up next time.",
    cs: "Přesuňme to a domluvme se příště.",
    tip: "Pairs naturally with “nothing pressing” — you cancel the meeting while keeping the relationship warm.",
    situation: "Chcete zrušit schůzku, ale zachovat dobrý vztah." },

  { id: "ev2-nudge", theme: "business-email", register: "neutral", lessons: [13], date: "2023-12-08",
    en: "Just nudging this back to the top of your inbox.",
    cs: "Jen to posouvám zpátky nahoru ve vaší schránce.",
    original: "I'm floating this back to the top of your mailbox",
    tip: "The standard, non-annoying follow-up. “Nudge” is deliberately gentle — far better than “Any update?” Say “inbox”, not “mailbox”.",
    situation: "Nikdo neodpověděl na váš e-mail. Připomeňte se slušně." },

  { id: "ev2-risk-being-pest", theme: "business-email", register: "client-safe", lessons: [13], date: "2023-12-08",
    en: "At the risk of being a pest —",
    cs: "S rizikem, že už otravuju —",
    tip: "Acknowledging you're chasing makes a second or third follow-up land far better. Self-aware, not apologetic.",
    situation: "Podruhé urgujete odpověď a chcete to odlehčit." },

  { id: "ev2-nag", theme: "pub-social", register: "casual", lessons: [13], date: "2023-12-08",
    en: "Stop nagging me. / Don't be a nag.",
    cs: "Přestaň mě otravovat. / Nebuď otrava.",
    tip: "“Nag” = repeatedly pester about something undone. Fine among friends and family; too personal for colleagues.",
    situation: "Někdo blízký vám pořád něco připomíná. Řekněte mu, ať toho nechá.",
    variants: ["You've been pestering me about this."] },

  { id: "ev2-pop-in", theme: "phrasal-verbs", register: "casual", lessons: [13], date: "2023-12-08",
    en: "I'll pop in sometime next week and see how you guys are doing.",
    cs: "Někdy příští týden se stavím a mrknu, jak se máte.",
    tip: "“Pop in” / “drop in” = a short, unannounced visit. Friendly and low-commitment.",
    situation: "Chcete se někdy příště nezávazně zastavit." },

  { id: "ev2-where-are-we", theme: "business-email", register: "neutral", lessons: [13], date: "2023-12-08",
    en: "…just to see where we are.",
    cs: "…jen abych zjistil, jak na tom jsme.",

/* Explicitly publish to the global object. Belt and braces alongside `var`:
   guarantees the app block can see this content in every browser context,
   including iOS Safari where cross-<script> lexical scope has bitten us. */
if (typeof window !== "undefined") {
  window.LESSONS = LESSONS;
  window.PHRASES = PHRASES;

<script>
"use strict";

/* ════════════════════════════════════════════════════════════════════
   State
   ════════════════════════════════════════════════════════════════════ */
const BUILD = "2026-09-02 23:28";          // replaced by build.py
const SRS_KEY  = "englishTrainer.srs.v1";
const HIST_KEY = "englishTrainer.history.v1";
const DAY = 86400000;
// Leitner intervals in days, by box index.
const INTERVALS = [0, 1, 3, 7, 21, 60];

const S = {
  mode: "learn",
  groups: "all",          // "all" or an array of group ids
  order: "smart",
  queue: [],
  i: 0,
  revealed: false,
  logged: {},                       // phrases already counted this session
  counts: { got: 0, nearly: 0, missed: 0 }
};

/* Storage is deliberately defensive: on iOS a file:// page can throw a
   SecurityError on the localStorage property itself, so every access is
   guarded. If storage is unavailable the app still runs — progress just
   isn't kept, and the UI says so. */
function store() {
  try { return window.localStorage || null; } catch (_) { return null; }
}
const STORAGE_OK = !!store();

function load() {
  try {
    const s = store(); if (!s) return {};
    const raw = s.getItem(SRS_KEY);
    if (!raw) return {};
    const data = JSON.parse(raw);
    // tolerate anything that isn't the shape we expect
    return (data && typeof data === "object" && !Array.isArray(data)) ? data : {};
  } catch (_) { return {}; }
}
function save() {
  try {
    const s = store(); if (!s) return;
    s.setItem(SRS_KEY, JSON.stringify(srs));
  } catch (_) { /* quota or private mode — session still works */ }
}

let srs = load();
let history = loadHistory();

/* ── review history: one counter per day, for the 7/30-day indicators ──
   Kept separate from `srs` so it survives independently and stays small
   (one short key per active day, pruned to a year). */
function loadHistory() {
  try {
    const s = store(); if (!s) return {};
    const raw = s.getItem(HIST_KEY);
    const d = raw ? JSON.parse(raw) : {};
    return (d && typeof d === "object" && !Array.isArray(d)) ? d : {};
  } catch (_) { return {}; }
}
function saveHistory() {
  try {
    const s = store(); if (!s) return;
    s.setItem(HIST_KEY, JSON.stringify(history));
  } catch (_) { /* ignore */ }
}
function dayKey(t) {
  const d = new Date(t == null ? Date.now() : t);
  return d.getFullYear() + "-" +
         String(d.getMonth() + 1).padStart(2, "0") + "-" +
         String(d.getDate()).padStart(2, "0");
}
// Record one review. `fresh` = first time this phrase was ever reviewed.
function logReview(fresh) {
  const k = dayKey();
  const e = history[k] || { r: 0, n: 0 };
  e.r += 1;
  if (fresh) e.n += 1;
  history[k] = e;

  // prune anything older than ~1 year so storage can't grow unbounded
  const cutoff = dayKey(Date.now() - 366 * DAY);
  Object.keys(history).forEach(d => { if (d < cutoff) delete history[d]; });
  saveHistory();
}
// Totals over the last `days` days, inclusive of today.
function since(days) {
  const from = dayKey(Date.now() - (days - 1) * DAY);
  let reviews = 0, phrases = 0, activeDays = 0;
  Object.keys(history).forEach(d => {
    if (d >= from) {
      reviews += history[d].r;
      phrases += history[d].n;
      activeDays++;
    }
  });
  return { reviews, phrases, activeDays };
}

const $ = id => document.getElementById(id);

/* ════════════════════════════════════════════════════════════════════
   Content helpers
   ════════════════════════════════════════════════════════════════════ */
const lessonById = {};
(typeof LESSONS !== "undefined" ? LESSONS : []).forEach(l => { lessonById[l.id] = l; });

function phraseDate(p) {
  if (p.date) return p.date;
  let best = "";
  (p.lessons || []).forEach(id => {
    const l = lessonById[id];
    if (l && l.date > best) best = l.date;
  });
  return best || "1970-01-01";
}

function themeLabel(t) {
  return t.replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase());
}

/* ── topic groups ─────────────────────────────────────────────────────
   S.groups holds the selected group ids ("all" means every group). */
const groupOf = {};                        // theme -> group id
(typeof GROUPS !== "undefined" ? GROUPS : []).forEach(g => {
  g.themes.forEach(t => { groupOf[t] = g.id; });
});

function groupCount(g) {
  return (typeof PHRASES !== "undefined" ? PHRASES : [])
    .filter(p => g.themes.indexOf(p.theme) > -1).length;
}

function poolFor(sel) {
  const all = typeof PHRASES !== "undefined" ? PHRASES : [];
  if (!sel || sel === "all" || !sel.length) return all.slice();
  return all.filter(p => sel.indexOf(groupOf[p.theme]) > -1);
}

/* A phrase is "proved" once it's been graded up to box 2+ in Testing;
   "learned" means seen at least once but not yet proved. */
function statusOf(id) {
  const e = srs[id];
  if (!e) return "new";
  return e.box >= 2 ? "proved" : "seen";
}

/* ── SRS ──────────────────────────────────────────────────────────── */
function box_of(id) { return srs[id] ? srs[id].box : 0; }
function due(id)    { return srs[id] ? srs[id].due : 0; }
function isDue(id)  { return due(id) <= Date.now(); }

function grade(id, g) {
  const cur = srs[id] || { box: 0, due: 0, seen: 0 };
  logReview(!srs[id]);              // fresh = never reviewed before
  let b = cur.box;
  if (g === "got")    b = Math.min(b + 1, INTERVALS.length - 1);
  else if (g === "nearly") b = Math.max(1, b);
  else                b = 1;                       // missed → back to box 1

  srs[id] = {
    box: b,
    // "missed" stays due immediately so it can resurface this session
    due: g === "missed" ? 0 : Date.now() + INTERVALS[b] * DAY,
    seen: cur.seen + 1,
    last: Date.now()
  };
  save();
}

/* ── ordering ─────────────────────────────────────────────────────── */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Mild recency bias: newer lessons score a little higher, but nothing is
// ever excluded — the user asked that every phrase stay reachable.
function recencyWeight(p) {
  const ageDays = (Date.now() - new Date(phraseDate(p)).getTime()) / DAY;
  return 1 + Math.max(0, 1 - ageDays / 730) * 0.6;   // ≤1.6× for brand-new
}

function buildQueue() {
  let pool = poolFor(S.groups);
  if (!pool.length) return [];

  if (S.order === "new")  return pool.sort((a, b) => phraseDate(b).localeCompare(phraseDate(a)));
  if (S.order === "old")  return pool.sort((a, b) => phraseDate(a).localeCompare(phraseDate(b)));
  if (S.order === "random") return shuffle(pool);

  // "smart": due-first (SRS wins over recency), then weighted shuffle.
  const dueNow = pool.filter(p => isDue(p.id));
  const rest   = pool.filter(p => !isDue(p.id));

  const weighted = arr => arr
    .map(p => ({ p, k: Math.random() / recencyWeight(p) }))
    .sort((a, b) => a.k - b.k)
    .map(o => o.p);

  return weighted(dueNow).concat(weighted(rest));
}

/* ════════════════════════════════════════════════════════════════════
   Home screen
   ════════════════════════════════════════════════════════════════════ */
const DAILY_GOAL = 20;      // phrases a day — what the goal bar fills toward

function renderActivity() {
  const streak = currentStreak();
  const todayN = history[dayKey()] ? history[dayKey()].r : 0;

  // streak
  $("s-days").textContent = streak;
  $("s-days").className = streak ? "" : "dim";
  $("s-flame").style.opacity = streak ? "1" : ".3";
  $("s-label").textContent = streak === 1 ? "day streak" : "day streak";

  // last 7 calendar days, Mon-style initials
  const names = ["S", "M", "T", "W", "T", "F", "S"];
  const today = dayKey();
  let html = "";
  for (let i = 6; i >= 0; i--) {
    const t = Date.now() - i * DAY;
    const k = dayKey(t);
    const did = !!history[k];
    html += `<div class="wd"><i class="${did ? "on" : ""}${k === today ? " today" : ""}"></i>` +
            `<u>${names[new Date(t).getDay()]}</u></div>`;
  }
  $("week-days").innerHTML = html;

  const w = since(7);
  $("week-cap").textContent = w.reviews
    ? `${w.reviews} phrases practiced this week`
    : "No practice yet this week";

  // today's goal
  const pct = Math.min(100, Math.round(todayN / DAILY_GOAL * 100));
  $("goal-fill").style.width = pct + "%";
  $("goal-txt").innerHTML = todayN >= DAILY_GOAL
    ? `🎉 <b>Daily goal reached</b> — ${todayN} today`
    : `<b>${todayN} / ${DAILY_GOAL}</b> today · ${DAILY_GOAL - todayN} to hit your goal`;

  // warn once if progress cannot be saved at all
  const box = document.querySelector(".streak");
  if (!STORAGE_OK && !box.querySelector(".nostore")) {
    const d = document.createElement("div");
    d.className = "nostore";
    d.innerHTML = "<b>Progress isn't being saved.</b> Open this page in Safari, " +
                  "then Share → Add to Home Screen.";
    box.appendChild(d);
  }
}

// Consecutive days with at least one review, counting back from today
// (or from yesterday, so a streak isn't broken before you practice today).
function currentStreak() {
  let n = 0;
  const startsToday = !!history[dayKey()];
  for (let i = startsToday ? 0 : 1; i < 400; i++) {
    if (history[dayKey(Date.now() - i * DAY)]) n++;
    else break;
  }
  return n;
}

function renderHome() {
  const all = (typeof PHRASES !== "undefined" ? PHRASES : []);
  const total = all.length;

  // ── progress: proved (green) / learned (orange) / new
  let proved = 0, seen = 0;
  all.forEach(p => {
    const s = statusOf(p.id);
    if (s === "proved") proved++; else if (s === "seen") seen++;
  });
  const fresh = total - proved - seen;

  const pool = poolFor(S.groups);
  const due  = pool.filter(p => isDue(p.id)).length;

  $("h-due").textContent   = due;
  $("h-unit").textContent  = "to practice";
  $("h-total").textContent = total;
  $("l-proved").textContent = proved;
  $("l-seen").textContent   = seen;
  $("l-new").textContent    = fresh;
  $("bar-proved").style.width = (total ? proved / total * 100 : 0) + "%";
  $("bar-seen").style.width   = (total ? seen  / total * 100 : 0) + "%";

  renderActivity();

  // ── topic groups
  const gc = $("groups");
  gc.innerHTML = "";
  (typeof GROUPS !== "undefined" ? GROUPS : []).forEach(g => {
    const on = S.groups === "all" || S.groups.indexOf(g.id) > -1;
    const b = document.createElement("button");
    b.className = "grp";
    b.setAttribute("aria-pressed", on);
    b.innerHTML = `<span class="gi">${g.icon}</span>` +
                  `<span class="gl">${esc(g.label)}</span>` +
                  `<span class="gn">${groupCount(g)}</span>`;
    b.onclick = () => { toggleGroup(g.id); };
    gc.appendChild(b);
  });

  const allOn = S.groups === "all";
  $("t-all").textContent = allOn ? "Pick one" : "All topics";

  // ── the two actions
  const n = pool.length;
  const label = allOn ? "all topics" : `${n} phrase${n === 1 ? "" : "s"}`;
  $("go-learn").disabled = n === 0;
  $("go-test").disabled  = n === 0;
  $("go-learn-sub").textContent = n ? label : "pick a topic";
  $("go-test-sub").textContent  = n ? (due ? `${due} due` : label) : "pick a topic";

  const studied = Object.keys(srs).length;
  $("foot").innerHTML = (studied
    ? `${studied} in progress · saved on this device`
    : "Progress is saved on this device") +
    ` · <a href="#" id="backup">back up</a>` +
    ` · <a href="#" id="refresh">refresh</a>` +
    `<br><span class="ver">${esc(BUILD)} · ${total} phrases</span>`;
  $("backup").onclick  = (e) => { e.preventDefault(); backup(); };
  $("refresh").onclick = (e) => { e.preventDefault(); hardReload(); };

  $("pill").textContent = "";
  $("quit").classList.add("hidden");
}

function toggleGroup(id) {
  const ids = (typeof GROUPS !== "undefined" ? GROUPS : []).map(g => g.id);
  // First tap out of "all" selects just that group — the common case.
  if (S.groups === "all") S.groups = [id];
  else {
    const i = S.groups.indexOf(id);
    if (i > -1) S.groups.splice(i, 1); else S.groups.push(id);
    if (!S.groups.length) S.groups = "all";
    else if (S.groups.length === ids.length) S.groups = "all";
  }
  renderHome();
}

/* ════════════════════════════════════════════════════════════════════
   Drill
   ════════════════════════════════════════════════════════════════════ */
function begin() {
  S.queue = buildQueue();
  S.i = 0;
  S.revealed = false;
  S.logged = {};
  S.counts = { got: 0, nearly: 0, missed: 0 };
  if (!S.queue.length) return;
  $("home").classList.add("hidden");
  $("finish").classList.add("hidden");
  $("drill").classList.remove("hidden");
  $("quit").classList.remove("hidden");
  step();
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function metaHtml(p) {
  const ls = (p.lessons || []).map(id => {
    const l = lessonById[id];
    return l ? esc(l.title) : "Lesson " + id;
  });
  const d = phraseDate(p);
  const yr = d && d !== "1970-01-01" ? d.slice(0, 7) : "";
  const reg = p.register || "neutral";
  return `<div class="meta">
      <span class="tag reg-${esc(reg)}">${esc(reg)}</span>
      <span class="tag">${esc(themeLabel(p.theme))}</span>
      <span>${ls.map(esc).join(" · ")}${yr ? " · " + yr : ""}</span>
    </div>`;
}

function learnCard(p) {
  let h = metaHtml(p);
  h += `<p class="en">${esc(p.en)}</p>`;
  h += `<p class="cs">${esc(p.cs)}</p>`;
  if (p.example) h += `<div class="block"><div class="h">In context</div><div class="b ex">${esc(p.example)}</div></div>`;
  if (p.tip)     h += `<div class="block"><div class="h">Tip</div><div class="b tip">${esc(p.tip)}</div></div>`;
  if (p.original && p.original !== p.en) {
    h += `<div class="warn"><div class="h">Your note — corrected</div>
          <s>${esc(p.original)}</s> → <b>${esc(p.en)}</b></div>`;
  }
  return h;
}

function testPrompt(p) {
  return `<div class="meta"><span class="tag">${esc(themeLabel(p.theme))}</span></div>
    <p class="situation">${esc(p.situation || p.cs)}</p>
    <p class="ask">Say it in English — out loud. Then reveal.</p>`;
}

function testAnswer(p) {
  let h = testPrompt(p);
  h += `<div class="answer">`;
  h += metaHtml(p);
  h += `<p class="en">${esc(p.en)}</p>`;
  h += `<p class="cs">${esc(p.cs)}</p>`;
  if (p.variants && p.variants.length) {
    h += `<div class="block"><div class="h">Also fine</div><ul class="variants">` +
         p.variants.map(v => `<li>${esc(v)}</li>`).join("") + `</ul></div>`;
  }
  if (p.tip) h += `<div class="block"><div class="h">Tip</div><div class="b tip">${esc(p.tip)}</div></div>`;
  h += `</div>`;
  return h;
}

function step() {
  const p = S.queue[S.i];
  if (!p) return finish();

  $("prog").style.width = (S.i / S.queue.length * 100) + "%";
  $("pill").textContent = `${S.i + 1} / ${S.queue.length}`;

  const box = $("cardbox");
  const acts = $("acts");
  // re-trigger the entry animation only on a new phrase, not on reveal
  box.className = S.revealed ? "card" : "card anim";
  acts.innerHTML = "";

  if (S.mode === "learn") {
    box.innerHTML = learnCard(p);
    // count a phrase as covered once it's actually been shown
    if (!S.logged[p.id]) { S.logged[p.id] = 1; logReview(false); }
    const b = document.createElement("button");
    b.className = "btn primary";
    b.textContent = S.i === S.queue.length - 1 ? "Finish" : "Next";
    b.onclick = next;
    acts.appendChild(b);
    return;
  }

  // testing
  if (!S.revealed) {
    box.innerHTML = testPrompt(p);
    const b = document.createElement("button");
    b.className = "btn primary";
    b.textContent = "Reveal";
    b.onclick = () => { S.revealed = true; step(); };
    acts.appendChild(b);
  } else {
    box.innerHTML = testAnswer(p);
    const row = document.createElement("div");
    row.className = "grades";
    [["got", "Got it", "+" + INTERVALS[Math.min(box_of(p.id) + 1, INTERVALS.length - 1)] + "d"],
     ["nearly", "Nearly", "1d"],
     ["missed", "Missed", "again"]].forEach(([g, label, sub]) => {
      const b = document.createElement("button");
      b.className = "btn g-" + (g === "got" ? "got" : g === "nearly" ? "nearly" : "miss");
      b.innerHTML = esc(label) + `<small>${esc(sub)}</small>`;
      b.onclick = () => {
        grade(p.id, g);
        S.counts[g]++;
        if (g === "missed") S.queue.push(p);   // resurface later this session
        next();
      };
      row.appendChild(b);
    });
    acts.appendChild(row);
  }
}

function next() {
  S.i++;
  S.revealed = false;
  if (S.i >= S.queue.length) return finish();
  step();
  window.scrollTo(0, 0);
}

function finish() {
  $("drill").classList.add("hidden");
  $("finish").classList.remove("hidden");
  $("pill").textContent = "";
  $("quit").classList.add("hidden");

  const c = S.counts;
  const graded = c.got + c.nearly + c.missed;
  const pct = graded ? Math.round(c.got / graded * 100) : 0;

  let h;
  if (S.mode === "test" && graded) {
    const C = 2 * Math.PI * 52;                       // r=52
    const off = C * (1 - pct / 100);
    h = `<div class="ring">
        <svg width="116" height="116" viewBox="0 0 116 116">
          <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3B6FF5"/><stop offset="1" stop-color="#7B4DFF"/>
          </linearGradient></defs>
          <circle class="track" cx="58" cy="58" r="52" fill="none" stroke-width="9"/>
          <circle class="fill"  cx="58" cy="58" r="52" fill="none" stroke-width="9"
                  stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}"/>
        </svg>
        <div class="pct">${pct}%</div>
      </div>
      <h2>${pct >= 80 ? "Excellent work" : pct >= 50 ? "Solid session" : "Keep going"}</h2>
      <p>${c.got} of ${graded} on first recall</p>
      <div class="stats">
        <div class="stat"><div class="v" style="color:var(--green)">${c.got}</div><div class="k">Got it</div></div>
        <div class="stat"><div class="v" style="color:var(--amber)">${c.nearly}</div><div class="k">Nearly</div></div>
        <div class="stat"><div class="v" style="color:var(--red)">${c.missed}</div><div class="k">Missed</div></div>
      </div>`;
  } else {
    h = `<div class="big">✅</div>
         <h2>Session complete</h2>
         <p>${S.queue.length} phrase${S.queue.length === 1 ? "" : "s"} reviewed</p>`;
  }
  $("donebox").innerHTML = h;

  // animate the ring after paint
  const fill = $("donebox").querySelector(".ring .fill");
  if (fill) {
    const C = 2 * Math.PI * 52;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => { fill.style.strokeDashoffset = (C * (1 - pct / 100)).toFixed(1); });
    });
  }

  const again = document.createElement("button");
  again.className = "btn primary";
  again.style.width = "100%";
  again.textContent = "Back to start";
  again.onclick = home;
  $("donebox").appendChild(again);
}

function home() {
  $("drill").classList.add("hidden");
  $("finish").classList.add("hidden");
  $("home").classList.remove("hidden");
  renderHome();
  window.scrollTo(0, 0);
}

/* ── backup / restore ─────────────────────────────────────────────────
   Progress lives in localStorage, which survives replacing the HTML file
   as long as the origin doesn't change. This is the belt-and-braces path:
   copy a small JSON blob out, paste it back in if anything is ever lost. */
function backup() {
  const blob = JSON.stringify({ v: 1, srs: srs, history: history });
  const restore = prompt(
    "Your progress (copy this somewhere safe).\n\n" +
    "To RESTORE instead: paste a previous backup here and press OK.",
    blob
  );
  if (restore == null) return;                       // cancelled
  const text = restore.trim();
  if (!text || text === blob) return;                // unchanged = just a copy
  try {
    const d = JSON.parse(text);
    if (!d || typeof d !== "object" || !d.srs) throw new Error("bad shape");
    srs = d.srs;
    history = (d.history && typeof d.history === "object") ? d.history : {};
    save(); saveHistory();
    renderHome();
    alert("Progress restored: " + Object.keys(srs).length + " phrases.");
  } catch (_) {
    alert("That didn't look like a valid backup — nothing was changed.");
  }
}

/* ── wiring ───────────────────────────────────────────────────────── */
$("go-learn").onclick = () => { S.mode = "learn"; begin(); };
$("go-test").onclick  = () => { S.mode = "test";  begin(); };
// With everything on, this clears to a single sensible starting point rather
// than to nothing (an empty selection has nothing to practise). Otherwise it
// selects everything.
$("t-all").onclick = () => {
  const ids = (typeof GROUPS !== "undefined" ? GROUPS : []).map(g => g.id);
  S.groups = (S.groups === "all") ? [ids[0]] : "all";
  renderHome();
};
$("quit").onclick = finish;

/* Startup. Any failure here must be VISIBLE — a silently dead Start button is
   indistinguishable from a static page, which cost real debugging time. */
function boot() {
  const data = (typeof PHRASES !== "undefined" && PHRASES) ||
               (typeof window !== "undefined" && window.PHRASES) || null;
  if (!data || !data.length) {
    fail("Phrase data didn't load.",
         "This is usually a cached old version. Tap Reload below — if that " +
         "doesn't help, close the app fully and reopen it.");
    return;
  }
  renderHome();
}

/* Show a failure the user can act on. Deliberately does NOT disable the app:
   a stale cache is the usual cause and a reload fixes it, so the escape hatch
   matters more than locking the UI down. */
function fail(title, detail) {
  const host = document.querySelector(".streak") || document.querySelector(".wrap");
  if (!host || document.getElementById("bootfail")) return;

  const d = document.createElement("div");
  d.id = "bootfail";
  d.className = "nostore";
  d.innerHTML = "<b>" + esc(title) + "</b><br>" + esc(detail) +
                '<br><button id="hard-reload" class="reloadbtn">Reload</button>';
  host.appendChild(d);

  const b = document.getElementById("hard-reload");
  if (b) b.onclick = hardReload;
}

// Bust every layer of cache we can reach, then reload from the network.
function hardReload() {
  try {
    if (window.caches && caches.keys) {
      caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).catch(() => {});
    }
  } catch (_) { /* ignore */ }
  // A changing query string defeats both the HTTP cache and the iOS webapp cache.
  const base = location.href.split(/[?#]/)[0];
  location.replace(base + "?v=" + Date.now());
}

// Surface uncaught errors, but only before the app is up — once the home
// screen has rendered, a stray error shouldn't paste a scary banner over a
// working app.
let booted = false;
window.addEventListener("error", function (e) {
  if (booted) return;
  fail("Something went wrong loading the app.",
       (e.message || "Unknown error") + (e.lineno ? "  (line " + e.lineno + ")" : ""));
});

try { boot(); booted = true; }
catch (e) { fail("Startup failed.", e.name + ": " + e.message); }
</script>
</body>
</html>
