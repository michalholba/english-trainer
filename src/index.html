<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<!-- The app is one file with all data inlined, so a stale cache means stale
     content. Prefer a network fetch; the app still works offline because iOS
     falls back to its own copy when there's no connection. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>English Trainer — C2 business English</title>
<meta name="description" content="Drill C2-level business English phrases with spaced repetition. Negotiation, meetings, networking, financial and legal English, with Czech translations and register notes.">
<link rel="canonical" href="https://michalholba.github.io/english-trainer/">

<!-- iOS home-screen install -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="English">
<meta name="theme-color" content="#3B6FF5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1017" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233B6FF5'/%3E%3Cstop offset='1' stop-color='%237B4DFF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='url(%23g)'/%3E%3Ctext x='90' y='126' font-family='-apple-system,Helvetica,Arial' font-size='100' font-weight='700' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   English Phrase Trainer — C2 business English drill
   Single file, zero dependencies. Content lives in content.js.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  color-scheme: light dark;

  --brand:       #3B6FF5;
  --brand-2:     #7B4DFF;
  --brand-deep:  #2450C8;
  --grad:        linear-gradient(135deg, #3B6FF5 0%, #7B4DFF 100%);

  --bg:          #F4F6FB;
  --bg-2:        #EAEEF8;
  --card:        #FFFFFF;
  --text:        #131A2B;
  --text-soft:   #5A6782;
  --text-faint:  #8B97AF;
  --line:        #E2E8F2;

  --green:       #0E9F76;
  --amber:       #E08600;
  --red:         #E0455A;
  --violet:      #7B4DFF;

  --sh-sm: 0 1px 2px rgba(19,26,43,.06), 0 1px 3px rgba(19,26,43,.04);
  --sh-md: 0 2px 4px rgba(19,26,43,.05), 0 6px 16px rgba(19,26,43,.07);
  --sh-lg: 0 8px 28px rgba(19,26,43,.10), 0 2px 6px rgba(19,26,43,.05);
  --sh-brand: 0 6px 18px rgba(59,111,245,.32);

  --r:    18px;
  --r-sm: 12px;
  --pad:  16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:         #0D1017;
    --bg-2:       #141926;
    --card:       #181E2A;
    --text:       #ECF1FA;
    --text-soft:  #A2AFC6;
    --text-faint: #6E7C95;
    --line:       #262E3E;
    --brand:      #6E9BFF;
    --brand-2:    #A98BFF;
    --brand-deep: #3B6FF5;
    --green:      #2BC79A;
    --amber:      #FFA92E;
    --red:        #FF6B7E;
    --violet:     #A98BFF;
    --sh-sm: 0 1px 2px rgba(0,0,0,.4);
    --sh-md: 0 4px 14px rgba(0,0,0,.45);
    --sh-lg: 0 10px 32px rgba(0,0,0,.55);
    --sh-brand: 0 6px 20px rgba(59,111,245,.42);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

/* soft ambient wash behind everything */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(90vw 55vh at 8% -8%,  rgba(59,111,245,.13), transparent 62%),
    radial-gradient(85vw 50vh at 100% 0%, rgba(123,77,255,.11), transparent 60%),
    linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 42%);
}

body {
  min-height: 100vh; min-height: 100dvh;
  padding: calc(var(--safe-t) + 6px) 0 calc(var(--safe-b) + 10px);
  display: flex; flex-direction: column;
}

.wrap {
  width: 100%; max-width: 640px;
  margin: 0 auto; padding: 0 var(--pad);
  flex: 1; display: flex; flex-direction: column;
}

/* ── header ───────────────────────────────────────────────────────── */
header { display: flex; align-items: center; gap: 10px; padding: 10px 2px 16px; }

.mark {
  width: 30px; height: 30px; border-radius: 9px; flex: none;
  background: var(--grad); box-shadow: var(--sh-brand);
  display: grid; place-items: center;
  color: #fff; font-weight: 800; font-size: 16px; letter-spacing: -.02em;
}
header h1 {
  font-size: 18px; font-weight: 700; margin: 0;
  letter-spacing: -.025em; flex: 1;
}

.pill {
  font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  padding: 5px 11px; border-radius: 999px;
  background: color-mix(in srgb, var(--brand) 13%, transparent);
  color: var(--brand-deep); white-space: nowrap;
}
@media (prefers-color-scheme: dark) { .pill { color: var(--brand); } }

.iconbtn {
  border: 1px solid var(--line); background: var(--card);
  color: var(--text-soft); border-radius: 10px;
  min-width: 44px; height: 36px; font-size: 14px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0 12px; box-shadow: var(--sh-sm);
  transition: transform .12s, background .15s;
}
.iconbtn:active { transform: scale(.96); background: var(--bg-2); }

/* ── card ─────────────────────────────────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 20px;
  box-shadow: var(--sh-md);
}

/* ── hero: progress at a glance ────────────────────────────────────── */
.hero {
  position: relative; overflow: hidden;
  border-radius: var(--r); padding: 15px 17px 13px;
  background: var(--grad); color: #fff;
  box-shadow: var(--sh-brand);
  margin-bottom: 12px;
}
.hero::after {
  content: ""; position: absolute; right: -40px; top: -60px;
  width: 180px; height: 180px; border-radius: 50%;
  background: rgba(255,255,255,.12);
}
.hero-top {
  position: relative; z-index: 1;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
}
.hero .kicker {
  font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; opacity: .8; margin-bottom: 4px;
}
.hero .figs { display: flex; align-items: baseline; gap: 7px; }
.hero .fig { font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.hero .unit { font-size: 14px; font-weight: 600; opacity: .9; }
.hero-total { text-align: right; line-height: 1.2; }
.hero-total b { display: block; font-size: 17px; font-weight: 800; }
.hero-total span { font-size: 10.5px; opacity: .78; text-transform: uppercase; letter-spacing: .06em; }

.hbar {
  position: relative; z-index: 1;
  margin-top: 12px; height: 8px; border-radius: 99px;
  background: rgba(255,255,255,.24); overflow: hidden;
  display: flex;
}
.hbar > i { display: block; height: 100%; width: 0; transition: width .7s cubic-bezier(.4,0,.2,1); }
.seg-proved { background: #34E29B; }
.seg-seen   { background: #FFC24B; }

.legend {
  position: relative; z-index: 1;
  display: flex; gap: 13px; margin-top: 9px;
  font-size: 11.5px; opacity: .95; flex-wrap: wrap;
}
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend b { font-weight: 800; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.proved { background: #34E29B; }
.dot.seen   { background: #FFC24B; }
.dot.new    { background: rgba(255,255,255,.45); }

/* ── streak / activity ────────────────────────────────────────────── */
.streak { padding: 13px 15px; margin-bottom: 4px; }
.streak-row { display: flex; align-items: center; gap: 14px; }
.streak-main { flex: none; text-align: center; min-width: 74px; }
.streak-n {
  display: flex; align-items: center; justify-content: center; gap: 3px;
  font-size: 27px; font-weight: 800; letter-spacing: -.03em; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.streak-n span { font-size: 21px; }
.streak-n b.dim { color: var(--text-faint); }
.streak-k {
  font-size: 10px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-faint); margin-top: 4px;
}
.week { flex: 1; min-width: 0; }
.week-days { display: flex; gap: 5px; }
.wd { flex: 1; text-align: center; }
.wd i {
  display: block; height: 26px; border-radius: 7px;
  background: var(--bg-2); border: 1px solid var(--line);
  position: relative; transition: background .3s;
}
.wd i.on { background: var(--grad); border-color: transparent; }
.wd i.today { box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand) 45%, transparent); }
.wd u {
  display: block; font-size: 9.5px; text-decoration: none; margin-top: 4px;
  color: var(--text-faint); font-weight: 700; letter-spacing: .02em;
}
.week-cap { font-size: 11px; color: var(--text-soft); margin-top: 7px; text-align: center; }

.goal { margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--line); }
.goal-bar { height: 6px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
.goal-bar > i {
  display: block; height: 100%; width: 0; border-radius: 99px;
  background: var(--grad); transition: width .6s cubic-bezier(.4,0,.2,1);
}
.goal-txt { font-size: 11.5px; color: var(--text-soft); margin-top: 6px; text-align: center; }
.goal-txt b { color: var(--text); font-weight: 700; }

.nostore {
  margin-top: 10px; padding: 9px 11px; border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--amber) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--amber) 30%, transparent);
  font-size: 12px; line-height: 1.45; color: var(--text);
}
.reloadbtn {
  font: inherit; font-size: 12.5px; font-weight: 700;
  margin-top: 8px; padding: 8px 16px; border-radius: 9px;
  border: 0; background: var(--grad); color: #fff; cursor: pointer;
}
.reloadbtn:active { filter: brightness(.92); }

/* ── section labels ───────────────────────────────────────────────── */
.seclabel {
  font-size: 11px; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--text-faint);
  margin: 14px 0 8px; padding-left: 2px;
  display: flex; align-items: center; justify-content: space-between;
}
.linkbtn {
  font: inherit; font-size: 11px; font-weight: 700; letter-spacing: .04em;
  text-transform: uppercase; color: var(--brand);
  background: none; border: 0; padding: 2px 0; cursor: pointer;
}
.linkbtn:active { opacity: .55; }

/* ── topic groups ─────────────────────────────────────────────────── */
.groups {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px;
}
.grp {
  font: inherit; cursor: pointer; text-align: center;
  padding: 9px 3px 8px; border-radius: 13px;
  border: 1.5px solid var(--line); background: var(--card);
  color: var(--text-soft); box-shadow: var(--sh-sm);
  transition: transform .12s, background .18s, color .18s, border-color .18s;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  min-height: 62px; justify-content: center;
}
.grp:active { transform: scale(.94); }
.grp .gi { font-size: 17px; line-height: 1; }
.grp .gl { font-size: 10.5px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
.grp .gn { font-size: 9.5px; font-weight: 700; opacity: .6; font-variant-numeric: tabular-nums; }
.grp[aria-pressed="true"] {
  border-color: transparent; background: var(--grad); color: #fff;
  box-shadow: var(--sh-brand);
}
.grp[aria-pressed="true"] .gn { opacity: .85; }

/* ── the two actions ──────────────────────────────────────────────── */
.go { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 14px; }
.cta {
  font: inherit; cursor: pointer; border: 0; border-radius: 15px;
  padding: 14px 10px 12px; color: #fff;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  transition: transform .12s, filter .18s;
}
.cta:active { transform: scale(.97); filter: brightness(.95); }
.cta:disabled { opacity: .4; }
.cta.learn { background: var(--grad); box-shadow: var(--sh-brand); }
.cta.test  { background: linear-gradient(135deg, #12B886 0%, #0E9F76 100%);
             box-shadow: 0 6px 18px rgba(14,159,118,.32); }
.cta-i { font-size: 19px; line-height: 1; }
.cta-t { font-size: 14.5px; font-weight: 750; letter-spacing: -.015em; }
.cta-s { font-size: 10.5px; opacity: .85; font-weight: 600; }

/* ── drill screen ─────────────────────────────────────────────────── */
.bar {
  height: 5px; background: var(--line); border-radius: 99px;
  overflow: hidden; margin-bottom: 16px;
}
.bar > i {
  display: block; height: 100%; border-radius: 99px;
  background: var(--grad); width: 0;
  transition: width .45s cubic-bezier(.4,0,.2,1);
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(10px) scale(.995); }
  to   { opacity: 1; transform: none; }
}
.anim { animation: cardIn .3s cubic-bezier(.2,.7,.3,1) both; }

@keyframes revealIn {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: none; }
}

.meta {
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  font-size: 11.5px; color: var(--text-faint); margin-bottom: 14px;
}
.tag {
  font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
  background: var(--bg-2); border: 1px solid transparent; color: var(--text-soft);
  letter-spacing: .01em;
}
.tag.reg-casual      { color: var(--violet); background: color-mix(in srgb, var(--violet) 13%, transparent); }
.tag.reg-neutral     { color: var(--text-soft); }
.tag.reg-client-safe { color: var(--green);  background: color-mix(in srgb, var(--green) 14%, transparent); }
.tag.reg-idiom       { color: var(--amber);  background: color-mix(in srgb, var(--amber) 15%, transparent); }
.tag.reg-formal      { color: var(--brand-deep); background: color-mix(in srgb, var(--brand) 13%, transparent); }
.tag.reg-slang       { color: var(--red);    background: color-mix(in srgb, var(--red) 13%, transparent); }
@media (prefers-color-scheme: dark) { .tag.reg-formal { color: var(--brand); } }

.en {
  font-size: 26px; line-height: 1.3; font-weight: 750;
  letter-spacing: -.03em; margin: 0 0 11px;
  background: var(--grad); -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.cs { font-size: 17px; color: var(--text-soft); margin: 0 0 2px; line-height: 1.45; }

.block { margin-top: 17px; padding-top: 16px; border-top: 1px solid var(--line); }
.block .h {
  font-size: 11px; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--text-faint); margin-bottom: 6px;
}
.block .b { font-size: 15.5px; line-height: 1.55; }
.ex {
  font-style: italic; color: var(--text-soft);
  padding-left: 13px; border-left: 3px solid color-mix(in srgb, var(--brand) 32%, transparent);
}
.tip { color: var(--text); }

.warn {
  margin-top: 16px; padding: 13px 15px; border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--amber) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--amber) 28%, transparent);
  font-size: 14.5px; line-height: 1.5;
}
.warn .h {
  font-size: 11px; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--amber); margin-bottom: 5px;
}
.warn s { color: var(--text-faint); text-decoration-thickness: 1.5px; }
.warn b { font-weight: 700; }

/* testing */
.situation { font-size: 21px; line-height: 1.4; font-weight: 650; letter-spacing: -.02em; margin: 8px 0 4px; }
.ask {
  font-size: 13.5px; color: var(--text-faint); margin-top: 14px;
  display: flex; align-items: center; gap: 7px;
}
.ask::before { content: "🗣"; font-size: 15px; }

.answer {
  margin-top: 20px; padding-top: 18px;
  border-top: 2px dashed var(--line);
  animation: revealIn .28s cubic-bezier(.2,.7,.3,1) both;
}

.variants { margin: 11px 0 0; padding-left: 17px; }
.variants li { font-size: 15px; color: var(--text-soft); margin-bottom: 5px; line-height: 1.45; }
.variants li::marker { color: var(--brand); }

/* actions */
.actions { display: grid; gap: 10px; margin-top: 18px; }
.grades  { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; }
.btn {
  font: inherit; font-size: 16px; font-weight: 700; letter-spacing: -.01em;
  padding: 15px 12px; border-radius: 14px;
  border: 1.5px solid var(--line); background: var(--card);
  color: var(--text); cursor: pointer; text-align: center;
  box-shadow: var(--sh-sm);
  transition: transform .12s, filter .18s, background .18s;
}
.btn:active { transform: scale(.97); }
.btn.primary {
  background: var(--grad); border-color: transparent; color: #fff;
  box-shadow: var(--sh-brand);
}
.btn.g-got    { border-color: color-mix(in srgb, var(--green) 45%, transparent); color: var(--green);
                background: color-mix(in srgb, var(--green) 7%, var(--card)); }
.btn.g-nearly { border-color: color-mix(in srgb, var(--amber) 45%, transparent); color: var(--amber);
                background: color-mix(in srgb, var(--amber) 7%, var(--card)); }
.btn.g-miss   { border-color: color-mix(in srgb, var(--red) 45%, transparent); color: var(--red);
                background: color-mix(in srgb, var(--red) 7%, var(--card)); }
.grades .btn { font-size: 14.5px; padding: 13px 4px; }
.grades .btn small {
  display: block; font-size: 10.5px; font-weight: 600;
  opacity: .72; margin-top: 3px; letter-spacing: .02em;
}

/* ── done ─────────────────────────────────────────────────────────── */
.done { text-align: center; padding: 36px 20px; }
.done .big { font-size: 52px; margin-bottom: 8px; line-height: 1; }
.done h2 { margin: 0 0 7px; font-size: 22px; font-weight: 750; letter-spacing: -.02em; }
.done p  { color: var(--text-soft); margin: 0 0 22px; font-size: 15px; }

.ring { margin: 0 auto 18px; width: 116px; height: 116px; position: relative; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring .track { stroke: var(--line); }
.ring .fill  { stroke: url(#ringGrad); stroke-linecap: round;
               transition: stroke-dashoffset .9s cubic-bezier(.4,0,.2,1); }
.ring .pct {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 28px; font-weight: 800; letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
}

.stats { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; }
.stat {
  flex: 1; max-width: 96px; padding: 13px 8px;
  border-radius: var(--r-sm); background: var(--bg-2);
}
.stat .v { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat .k {
  font-size: 10.5px; color: var(--text-faint); text-transform: uppercase;
  letter-spacing: .07em; font-weight: 700; margin-top: 2px;
}

.hidden { display: none !important; }

footer { text-align: center; font-size: 12px; color: var(--text-faint); padding: 20px 0 6px; }
footer a { color: var(--brand); text-decoration: none; font-weight: 600; }
footer a:active { opacity: .6; }
footer .ver { display: inline-block; margin-top: 4px; opacity: .6; font-size: 10.5px; }

@media (max-width: 380px) {
  .en { font-size: 23px; }
  .situation { font-size: 19px; }
  .hero .fig { font-size: 33px; }
  .grades .btn { font-size: 13.5px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="mark">E</span>
    <h1 id="title">English Trainer</h1>
    <span class="pill" id="pill"></span>
    <button class="iconbtn hidden" id="quit" title="End session">Done</button>
  </header>

  <!-- ══ HOME ══ -->
  <main id="home">

    <!-- progress: seen (orange) vs proved in testing (green) -->
    <section class="hero">
      <div class="hero-top">
        <div>
          <div class="kicker">Ready to practice</div>
          <div class="figs">
            <span class="fig" id="h-due">0</span>
            <span class="unit" id="h-unit">to practice</span>
          </div>
        </div>
        <div class="hero-total"><b id="h-total">0</b><span>phrases</span></div>
      </div>

      <div class="hbar">
        <i class="seg-proved" id="bar-proved"></i><i class="seg-seen" id="bar-seen"></i>
      </div>
      <div class="legend">
        <span><i class="dot proved"></i><b id="l-proved">0</b> proved</span>
        <span><i class="dot seen"></i><b id="l-seen">0</b> learned</span>
        <span><i class="dot new"></i><b id="l-new">0</b> new</span>
      </div>
    </section>

    <!-- activity: framed as a goal, not a bare number -->
    <section class="card streak">
      <div class="streak-row">
        <div class="streak-main">
          <div class="streak-n"><span id="s-flame">🔥</span><b id="s-days">0</b></div>
          <div class="streak-k" id="s-label">day streak</div>
        </div>
        <div class="week">
          <div class="week-days" id="week-days"></div>
          <div class="week-cap" id="week-cap"></div>
        </div>
      </div>
      <div class="goal">
        <div class="goal-bar"><i id="goal-fill"></i></div>
        <div class="goal-txt" id="goal-txt"></div>
      </div>
    </section>

    <!-- topic picker: 8 groups, multi-select, All by default -->
    <div class="seclabel">
      <span>Topics</span>
      <button class="linkbtn" id="t-all">Select all</button>
    </div>
    <div class="groups" id="groups"></div>

    <!-- two immediate actions -->
    <div class="go">
      <button class="cta learn" id="go-learn">
        <span class="cta-i">📖</span>
        <span class="cta-t">Start learning</span>
        <span class="cta-s" id="go-learn-sub"></span>
      </button>
      <button class="cta test" id="go-test">
        <span class="cta-i">🎯</span>
        <span class="cta-t">Start testing</span>
        <span class="cta-s" id="go-test-sub"></span>
      </button>
    </div>

    <footer id="foot"></footer>
  </main>

  <!-- ══ DRILL ══ -->
  <main id="drill" class="hidden">
    <div class="bar"><i id="prog"></i></div>
    <div class="card" id="cardbox"></div>
    <div class="actions" id="acts"></div>
  </main>

  <!-- ══ DONE ══ -->
  <main id="finish" class="hidden">
    <div class="card done" id="donebox"></div>
  </main>

</div>

<script src="content.js"></script>
<script>
"use strict";

/* ════════════════════════════════════════════════════════════════════
   State
   ════════════════════════════════════════════════════════════════════ */
const BUILD = "__BUILD__";          // replaced by build.py
const SRS_KEY  = "englishTrainer.srs.v1";
const HIST_KEY = "englishTrainer.history.v1";
const DAY = 86400000;
// Leitner intervals in days, by box index.
const INTERVALS = [0, 1, 3, 7, 21, 60];

const S = {
  mode: "learn",
  groups: "all",          // "all" or an array of group ids
  order: "smart",
  queue: [],
  i: 0,
  revealed: false,
  logged: {},                       // phrases already counted this session
  counts: { got: 0, nearly: 0, missed: 0 }
};

/* Storage is deliberately defensive: on iOS a file:// page can throw a
   SecurityError on the localStorage property itself, so every access is
   guarded. If storage is unavailable the app still runs — progress just
   isn't kept, and the UI says so. */
function store() {
  try { return window.localStorage || null; } catch (_) { return null; }
}
const STORAGE_OK = !!store();

function load() {
  try {
    const s = store(); if (!s) return {};
    const raw = s.getItem(SRS_KEY);
    if (!raw) return {};
    const data = JSON.parse(raw);
    // tolerate anything that isn't the shape we expect
    return (data && typeof data === "object" && !Array.isArray(data)) ? data : {};
  } catch (_) { return {}; }
}
function save() {
  try {
    const s = store(); if (!s) return;
    s.setItem(SRS_KEY, JSON.stringify(srs));
  } catch (_) { /* quota or private mode — session still works */ }
}

let srs = load();
let history = loadHistory();

/* ── review history: one counter per day, for the 7/30-day indicators ──
   Kept separate from `srs` so it survives independently and stays small
   (one short key per active day, pruned to a year). */
function loadHistory() {
  try {
    const s = store(); if (!s) return {};
    const raw = s.getItem(HIST_KEY);
    const d = raw ? JSON.parse(raw) : {};
    return (d && typeof d === "object" && !Array.isArray(d)) ? d : {};
  } catch (_) { return {}; }
}
function saveHistory() {
  try {
    const s = store(); if (!s) return;
    s.setItem(HIST_KEY, JSON.stringify(history));
  } catch (_) { /* ignore */ }
}
function dayKey(t) {
  const d = new Date(t == null ? Date.now() : t);
  return d.getFullYear() + "-" +
         String(d.getMonth() + 1).padStart(2, "0") + "-" +
         String(d.getDate()).padStart(2, "0");
}
// Record one review. `fresh` = first time this phrase was ever reviewed.
function logReview(fresh) {
  const k = dayKey();
  const e = history[k] || { r: 0, n: 0 };
  e.r += 1;
  if (fresh) e.n += 1;
  history[k] = e;

  // prune anything older than ~1 year so storage can't grow unbounded
  const cutoff = dayKey(Date.now() - 366 * DAY);
  Object.keys(history).forEach(d => { if (d < cutoff) delete history[d]; });
  saveHistory();
}
// Totals over the last `days` days, inclusive of today.
function since(days) {
  const from = dayKey(Date.now() - (days - 1) * DAY);
  let reviews = 0, phrases = 0, activeDays = 0;
  Object.keys(history).forEach(d => {
    if (d >= from) {
      reviews += history[d].r;
      phrases += history[d].n;
      activeDays++;
    }
  });
  return { reviews, phrases, activeDays };
}

const $ = id => document.getElementById(id);

/* ════════════════════════════════════════════════════════════════════
   Content helpers
   ════════════════════════════════════════════════════════════════════ */
const lessonById = {};
(typeof LESSONS !== "undefined" ? LESSONS : []).forEach(l => { lessonById[l.id] = l; });

function phraseDate(p) {
  if (p.date) return p.date;
  let best = "";
  (p.lessons || []).forEach(id => {
    const l = lessonById[id];
    if (l && l.date > best) best = l.date;
  });
  return best || "1970-01-01";
}

function themeLabel(t) {
  return t.replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase());
}

/* ── topic groups ─────────────────────────────────────────────────────
   S.groups holds the selected group ids ("all" means every group). */
const groupOf = {};                        // theme -> group id
(typeof GROUPS !== "undefined" ? GROUPS : []).forEach(g => {
  g.themes.forEach(t => { groupOf[t] = g.id; });
});

function groupCount(g) {
  return (typeof PHRASES !== "undefined" ? PHRASES : [])
    .filter(p => g.themes.indexOf(p.theme) > -1).length;
}

function poolFor(sel) {
  const all = typeof PHRASES !== "undefined" ? PHRASES : [];
  if (!sel || sel === "all" || !sel.length) return all.slice();
  return all.filter(p => sel.indexOf(groupOf[p.theme]) > -1);
}

/* A phrase is "proved" once it's been graded up to box 2+ in Testing;
   "learned" means seen at least once but not yet proved. */
function statusOf(id) {
  const e = srs[id];
  if (!e) return "new";
  return e.box >= 2 ? "proved" : "seen";
}

/* ── SRS ──────────────────────────────────────────────────────────── */
function box_of(id) { return srs[id] ? srs[id].box : 0; }
function due(id)    { return srs[id] ? srs[id].due : 0; }
function isDue(id)  { return due(id) <= Date.now(); }

function grade(id, g) {
  const cur = srs[id] || { box: 0, due: 0, seen: 0 };
  logReview(!srs[id]);              // fresh = never reviewed before
  let b = cur.box;
  if (g === "got")    b = Math.min(b + 1, INTERVALS.length - 1);
  else if (g === "nearly") b = Math.max(1, b);
  else                b = 1;                       // missed → back to box 1

  srs[id] = {
    box: b,
    // "missed" stays due immediately so it can resurface this session
    due: g === "missed" ? 0 : Date.now() + INTERVALS[b] * DAY,
    seen: cur.seen + 1,
    last: Date.now()
  };
  save();
}

/* ── ordering ─────────────────────────────────────────────────────── */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Mild recency bias: newer lessons score a little higher, but nothing is
// ever excluded — the user asked that every phrase stay reachable.
function recencyWeight(p) {
  const ageDays = (Date.now() - new Date(phraseDate(p)).getTime()) / DAY;
  return 1 + Math.max(0, 1 - ageDays / 730) * 0.6;   // ≤1.6× for brand-new
}

function buildQueue() {
  let pool = poolFor(S.groups);
  if (!pool.length) return [];

  if (S.order === "new")  return pool.sort((a, b) => phraseDate(b).localeCompare(phraseDate(a)));
  if (S.order === "old")  return pool.sort((a, b) => phraseDate(a).localeCompare(phraseDate(b)));
  if (S.order === "random") return shuffle(pool);

  // "smart": due-first (SRS wins over recency), then weighted shuffle.
  const dueNow = pool.filter(p => isDue(p.id));
  const rest   = pool.filter(p => !isDue(p.id));

  const weighted = arr => arr
    .map(p => ({ p, k: Math.random() / recencyWeight(p) }))
    .sort((a, b) => a.k - b.k)
    .map(o => o.p);

  return weighted(dueNow).concat(weighted(rest));
}

/* ════════════════════════════════════════════════════════════════════
   Home screen
   ════════════════════════════════════════════════════════════════════ */
const DAILY_GOAL = 20;      // phrases a day — what the goal bar fills toward

function renderActivity() {
  const streak = currentStreak();
  const todayN = history[dayKey()] ? history[dayKey()].r : 0;

  // streak
  $("s-days").textContent = streak;
  $("s-days").className = streak ? "" : "dim";
  $("s-flame").style.opacity = streak ? "1" : ".3";
  $("s-label").textContent = streak === 1 ? "day streak" : "day streak";

  // last 7 calendar days, Mon-style initials
  const names = ["S", "M", "T", "W", "T", "F", "S"];
  const today = dayKey();
  let html = "";
  for (let i = 6; i >= 0; i--) {
    const t = Date.now() - i * DAY;
    const k = dayKey(t);
    const did = !!history[k];
    html += `<div class="wd"><i class="${did ? "on" : ""}${k === today ? " today" : ""}"></i>` +
            `<u>${names[new Date(t).getDay()]}</u></div>`;
  }
  $("week-days").innerHTML = html;

  const w = since(7);
  $("week-cap").textContent = w.reviews
    ? `${w.reviews} phrases practiced this week`
    : "No practice yet this week";

  // today's goal
  const pct = Math.min(100, Math.round(todayN / DAILY_GOAL * 100));
  $("goal-fill").style.width = pct + "%";
  $("goal-txt").innerHTML = todayN >= DAILY_GOAL
    ? `🎉 <b>Daily goal reached</b> — ${todayN} today`
    : `<b>${todayN} / ${DAILY_GOAL}</b> today · ${DAILY_GOAL - todayN} to hit your goal`;

  // warn once if progress cannot be saved at all
  const box = document.querySelector(".streak");
  if (!STORAGE_OK && !box.querySelector(".nostore")) {
    const d = document.createElement("div");
    d.className = "nostore";
    d.innerHTML = "<b>Progress isn't being saved.</b> Open this page in Safari, " +
                  "then Share → Add to Home Screen.";
    box.appendChild(d);
  }
}

// Consecutive days with at least one review, counting back from today
// (or from yesterday, so a streak isn't broken before you practice today).
function currentStreak() {
  let n = 0;
  const startsToday = !!history[dayKey()];
  for (let i = startsToday ? 0 : 1; i < 400; i++) {
    if (history[dayKey(Date.now() - i * DAY)]) n++;
    else break;
  }
  return n;
}

function renderHome() {
  const all = (typeof PHRASES !== "undefined" ? PHRASES : []);
  const total = all.length;

  // ── progress: proved (green) / learned (orange) / new
  let proved = 0, seen = 0;
  all.forEach(p => {
    const s = statusOf(p.id);
    if (s === "proved") proved++; else if (s === "seen") seen++;
  });
  const fresh = total - proved - seen;

  const pool = poolFor(S.groups);
  const due  = pool.filter(p => isDue(p.id)).length;

  $("h-due").textContent   = due;
  $("h-unit").textContent  = "to practice";
  $("h-total").textContent = total;
  $("l-proved").textContent = proved;
  $("l-seen").textContent   = seen;
  $("l-new").textContent    = fresh;
  $("bar-proved").style.width = (total ? proved / total * 100 : 0) + "%";
  $("bar-seen").style.width   = (total ? seen  / total * 100 : 0) + "%";

  renderActivity();

  // ── topic groups
  const gc = $("groups");
  gc.innerHTML = "";
  (typeof GROUPS !== "undefined" ? GROUPS : []).forEach(g => {
    const on = S.groups === "all" || S.groups.indexOf(g.id) > -1;
    const b = document.createElement("button");
    b.className = "grp";
    b.setAttribute("aria-pressed", on);
    b.innerHTML = `<span class="gi">${g.icon}</span>` +
                  `<span class="gl">${esc(g.label)}</span>` +
                  `<span class="gn">${groupCount(g)}</span>`;
    b.onclick = () => { toggleGroup(g.id); };
    gc.appendChild(b);
  });

  const allOn = S.groups === "all";
  $("t-all").textContent = allOn ? "Pick one" : "All topics";

  // ── the two actions
  const n = pool.length;
  const label = allOn ? "all topics" : `${n} phrase${n === 1 ? "" : "s"}`;
  $("go-learn").disabled = n === 0;
  $("go-test").disabled  = n === 0;
  $("go-learn-sub").textContent = n ? label : "pick a topic";
  $("go-test-sub").textContent  = n ? (due ? `${due} due` : label) : "pick a topic";

  const studied = Object.keys(srs).length;
  $("foot").innerHTML = (studied
    ? `${studied} in progress · saved on this device`
    : "Progress is saved on this device") +
    ` · <a href="#" id="backup">back up</a>` +
    ` · <a href="#" id="refresh">refresh</a>` +
    `<br><span class="ver">${esc(BUILD)} · ${total} phrases</span>`;
  $("backup").onclick  = (e) => { e.preventDefault(); backup(); };
  $("refresh").onclick = (e) => { e.preventDefault(); hardReload(); };

  $("pill").textContent = "";
  $("quit").classList.add("hidden");
}

function toggleGroup(id) {
  const ids = (typeof GROUPS !== "undefined" ? GROUPS : []).map(g => g.id);
  // First tap out of "all" selects just that group — the common case.
  if (S.groups === "all") S.groups = [id];
  else {
    const i = S.groups.indexOf(id);
    if (i > -1) S.groups.splice(i, 1); else S.groups.push(id);
    if (!S.groups.length) S.groups = "all";
    else if (S.groups.length === ids.length) S.groups = "all";
  }
  renderHome();
}

/* ════════════════════════════════════════════════════════════════════
   Drill
   ════════════════════════════════════════════════════════════════════ */
function begin() {
  S.queue = buildQueue();
  S.i = 0;
  S.revealed = false;
  S.logged = {};
  S.counts = { got: 0, nearly: 0, missed: 0 };
  if (!S.queue.length) return;
  $("home").classList.add("hidden");
  $("finish").classList.add("hidden");
  $("drill").classList.remove("hidden");
  $("quit").classList.remove("hidden");
  step();
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function metaHtml(p) {
  const ls = (p.lessons || []).map(id => {
    const l = lessonById[id];
    return l ? esc(l.title) : "Lesson " + id;
  });
  const d = phraseDate(p);
  const yr = d && d !== "1970-01-01" ? d.slice(0, 7) : "";
  const reg = p.register || "neutral";
  return `<div class="meta">
      <span class="tag reg-${esc(reg)}">${esc(reg)}</span>
      <span class="tag">${esc(themeLabel(p.theme))}</span>
      <span>${ls.map(esc).join(" · ")}${yr ? " · " + yr : ""}</span>
    </div>`;
}

function learnCard(p) {
  let h = metaHtml(p);
  h += `<p class="en">${esc(p.en)}</p>`;
  h += `<p class="cs">${esc(p.cs)}</p>`;
  if (p.example) h += `<div class="block"><div class="h">In context</div><div class="b ex">${esc(p.example)}</div></div>`;
  if (p.tip)     h += `<div class="block"><div class="h">Tip</div><div class="b tip">${esc(p.tip)}</div></div>`;
  if (p.original && p.original !== p.en) {
    h += `<div class="warn"><div class="h">Your note — corrected</div>
          <s>${esc(p.original)}</s> → <b>${esc(p.en)}</b></div>`;
  }
  return h;
}

function testPrompt(p) {
  return `<div class="meta"><span class="tag">${esc(themeLabel(p.theme))}</span></div>
    <p class="situation">${esc(p.situation || p.cs)}</p>
    <p class="ask">Say it in English — out loud. Then reveal.</p>`;
}

function testAnswer(p) {
  let h = testPrompt(p);
  h += `<div class="answer">`;
  h += metaHtml(p);
  h += `<p class="en">${esc(p.en)}</p>`;
  h += `<p class="cs">${esc(p.cs)}</p>`;
  if (p.variants && p.variants.length) {
    h += `<div class="block"><div class="h">Also fine</div><ul class="variants">` +
         p.variants.map(v => `<li>${esc(v)}</li>`).join("") + `</ul></div>`;
  }
  if (p.tip) h += `<div class="block"><div class="h">Tip</div><div class="b tip">${esc(p.tip)}</div></div>`;
  h += `</div>`;
  return h;
}

function step() {
  const p = S.queue[S.i];
  if (!p) return finish();

  $("prog").style.width = (S.i / S.queue.length * 100) + "%";
  $("pill").textContent = `${S.i + 1} / ${S.queue.length}`;

  const box = $("cardbox");
  const acts = $("acts");
  // re-trigger the entry animation only on a new phrase, not on reveal
  box.className = S.revealed ? "card" : "card anim";
  acts.innerHTML = "";

  if (S.mode === "learn") {
    box.innerHTML = learnCard(p);
    // count a phrase as covered once it's actually been shown
    if (!S.logged[p.id]) { S.logged[p.id] = 1; logReview(false); }
    const b = document.createElement("button");
    b.className = "btn primary";
    b.textContent = S.i === S.queue.length - 1 ? "Finish" : "Next";
    b.onclick = next;
    acts.appendChild(b);
    return;
  }

  // testing
  if (!S.revealed) {
    box.innerHTML = testPrompt(p);
    const b = document.createElement("button");
    b.className = "btn primary";
    b.textContent = "Reveal";
    b.onclick = () => { S.revealed = true; step(); };
    acts.appendChild(b);
  } else {
    box.innerHTML = testAnswer(p);
    const row = document.createElement("div");
    row.className = "grades";
    [["got", "Got it", "+" + INTERVALS[Math.min(box_of(p.id) + 1, INTERVALS.length - 1)] + "d"],
     ["nearly", "Nearly", "1d"],
     ["missed", "Missed", "again"]].forEach(([g, label, sub]) => {
      const b = document.createElement("button");
      b.className = "btn g-" + (g === "got" ? "got" : g === "nearly" ? "nearly" : "miss");
      b.innerHTML = esc(label) + `<small>${esc(sub)}</small>`;
      b.onclick = () => {
        grade(p.id, g);
        S.counts[g]++;
        if (g === "missed") S.queue.push(p);   // resurface later this session
        next();
      };
      row.appendChild(b);
    });
    acts.appendChild(row);
  }
}

function next() {
  S.i++;
  S.revealed = false;
  if (S.i >= S.queue.length) return finish();
  step();
  window.scrollTo(0, 0);
}

function finish() {
  $("drill").classList.add("hidden");
  $("finish").classList.remove("hidden");
  $("pill").textContent = "";
  $("quit").classList.add("hidden");

  const c = S.counts;
  const graded = c.got + c.nearly + c.missed;
  const pct = graded ? Math.round(c.got / graded * 100) : 0;

  let h;
  if (S.mode === "test" && graded) {
    const C = 2 * Math.PI * 52;                       // r=52
    const off = C * (1 - pct / 100);
    h = `<div class="ring">
        <svg width="116" height="116" viewBox="0 0 116 116">
          <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3B6FF5"/><stop offset="1" stop-color="#7B4DFF"/>
          </linearGradient></defs>
          <circle class="track" cx="58" cy="58" r="52" fill="none" stroke-width="9"/>
          <circle class="fill"  cx="58" cy="58" r="52" fill="none" stroke-width="9"
                  stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}"/>
        </svg>
        <div class="pct">${pct}%</div>
      </div>
      <h2>${pct >= 80 ? "Excellent work" : pct >= 50 ? "Solid session" : "Keep going"}</h2>
      <p>${c.got} of ${graded} on first recall</p>
      <div class="stats">
        <div class="stat"><div class="v" style="color:var(--green)">${c.got}</div><div class="k">Got it</div></div>
        <div class="stat"><div class="v" style="color:var(--amber)">${c.nearly}</div><div class="k">Nearly</div></div>
        <div class="stat"><div class="v" style="color:var(--red)">${c.missed}</div><div class="k">Missed</div></div>
      </div>`;
  } else {
    h = `<div class="big">✅</div>
         <h2>Session complete</h2>
         <p>${S.queue.length} phrase${S.queue.length === 1 ? "" : "s"} reviewed</p>`;
  }
  $("donebox").innerHTML = h;

  // animate the ring after paint
  const fill = $("donebox").querySelector(".ring .fill");
  if (fill) {
    const C = 2 * Math.PI * 52;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => { fill.style.strokeDashoffset = (C * (1 - pct / 100)).toFixed(1); });
    });
  }

  const again = document.createElement("button");
  again.className = "btn primary";
  again.style.width = "100%";
  again.textContent = "Back to start";
  again.onclick = home;
  $("donebox").appendChild(again);
}

function home() {
  $("drill").classList.add("hidden");
  $("finish").classList.add("hidden");
  $("home").classList.remove("hidden");
  renderHome();
  window.scrollTo(0, 0);
}

/* ── backup / restore ─────────────────────────────────────────────────
   Progress lives in localStorage, which survives replacing the HTML file
   as long as the origin doesn't change. This is the belt-and-braces path:
   copy a small JSON blob out, paste it back in if anything is ever lost. */
function backup() {
  const blob = JSON.stringify({ v: 1, srs: srs, history: history });
  const restore = prompt(
    "Your progress (copy this somewhere safe).\n\n" +
    "To RESTORE instead: paste a previous backup here and press OK.",
    blob
  );
  if (restore == null) return;                       // cancelled
  const text = restore.trim();
  if (!text || text === blob) return;                // unchanged = just a copy
  try {
    const d = JSON.parse(text);
    if (!d || typeof d !== "object" || !d.srs) throw new Error("bad shape");
    srs = d.srs;
    history = (d.history && typeof d.history === "object") ? d.history : {};
    save(); saveHistory();
    renderHome();
    alert("Progress restored: " + Object.keys(srs).length + " phrases.");
  } catch (_) {
    alert("That didn't look like a valid backup — nothing was changed.");
  }
}

/* ── wiring ───────────────────────────────────────────────────────── */
$("go-learn").onclick = () => { S.mode = "learn"; begin(); };
$("go-test").onclick  = () => { S.mode = "test";  begin(); };
// With everything on, this clears to a single sensible starting point rather
// than to nothing (an empty selection has nothing to practise). Otherwise it
// selects everything.
$("t-all").onclick = () => {
  const ids = (typeof GROUPS !== "undefined" ? GROUPS : []).map(g => g.id);
  S.groups = (S.groups === "all") ? [ids[0]] : "all";
  renderHome();
};
$("quit").onclick = finish;

/* Startup. Any failure here must be VISIBLE — a silently dead Start button is
   indistinguishable from a static page, which cost real debugging time. */
function boot() {
  const data = (typeof PHRASES !== "undefined" && PHRASES) ||
               (typeof window !== "undefined" && window.PHRASES) || null;
  if (!data || !data.length) {
    fail("Phrase data didn't load.",
         "This is usually a cached old version. Tap Reload below — if that " +
         "doesn't help, close the app fully and reopen it.");
    return;
  }
  renderHome();
}

/* Show a failure the user can act on. Deliberately does NOT disable the app:
   a stale cache is the usual cause and a reload fixes it, so the escape hatch
   matters more than locking the UI down. */
function fail(title, detail) {
  const host = document.querySelector(".streak") || document.querySelector(".wrap");
  if (!host || document.getElementById("bootfail")) return;

  const d = document.createElement("div");
  d.id = "bootfail";
  d.className = "nostore";
  d.innerHTML = "<b>" + esc(title) + "</b><br>" + esc(detail) +
                '<br><button id="hard-reload" class="reloadbtn">Reload</button>';
  host.appendChild(d);

  const b = document.getElementById("hard-reload");
  if (b) b.onclick = hardReload;
}

// Bust every layer of cache we can reach, then reload from the network.
function hardReload() {
  try {
    if (window.caches && caches.keys) {
      caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).catch(() => {});
    }
  } catch (_) { /* ignore */ }
  // A changing query string defeats both the HTTP cache and the iOS webapp cache.
  const base = location.href.split(/[?#]/)[0];
  location.replace(base + "?v=" + Date.now());
}

// Surface uncaught errors, but only before the app is up — once the home
// screen has rendered, a stray error shouldn't paste a scary banner over a
// working app.
let booted = false;
window.addEventListener("error", function (e) {
  if (booted) return;
  fail("Something went wrong loading the app.",
       (e.message || "Unknown error") + (e.lineno ? "  (line " + e.lineno + ")" : ""));
});

try { boot(); booted = true; }
catch (e) { fail("Startup failed.", e.name + ": " + e.message); }
</script>
